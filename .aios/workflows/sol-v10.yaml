  #                              ERROR HANDLING
  # ═══════════════════════════════════════════════════════════════════════════════════

  error_handling:
    missing_reference_docs:
      message: "Documento de referencia nao encontrado: {missingDoc}"
      suggestion: "Verificar se docs/prompts/prompt-strategy.md, base-system-prompt.md e classification-prompt.md existem"
      action: halt

    typecheck_failure:
      message: "TypeCheck falhou apos mudanca em {file}"
      suggestion: "Reverter e tentar abordagem alternativa"
      action: continue

    migration_incomplete:
      message: "Migracao Claude incompleta: {remainingRefs} referencias OpenAI restantes"
      suggestion: "Executar *sol-v10-claude novamente para completar"
      action: halt

    schema_conflict:
      message: "Conflito de migration Prisma: {conflictDetails}"
      suggestion: "Resolver conflito manualmente e re-executar prisma migrate dev"
      action: halt

    agent_timeout:
      message: "Agente {agent} excedeu timeout na fase {phase_name}"
      suggestion: "Executar fase individualmente: *sol-v10-{phase_shortname}"
      action: halt

