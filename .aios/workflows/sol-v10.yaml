  decision_guidance:
    when_to_use:
      - Refactor completo do SOL para v10.0
      - Migracao de provider de IA (OpenAI → Claude)
      - Implementacao do Prompt Engine com 3 camadas
      - Implementacao do Perfil do Expert
      - Implementacao do Epic 8 Feedback Loop
      - Atualizacao de PRD e documentacao tecnica

    when_not_to_use:
      - Bug fix simples no SOL
      - Feature isolada que nao depende das 6 mudancas
      - Atualizacao apenas de docs (usar brownfield)

    notes: |
      PRIORIDADE SE PRECISAR CORTAR SCOPE:
      Fase 3 > Fase 4 (4.2, 4.4) > Fase 4 (4.1, 4.3) > Fase 5 > Fase 1

      O Perfil do Expert NAO bloqueia o Prompt Engine — o engine funciona sem ele
      (usa so produto + quiz). O perfil e um upgrade progressivo da experiencia.

      Conteudo real dos .md de modulos e padroes sera escrito por Eden Corporate
      APOS infraestrutura pronta. Placeholders nao bloqueiam dev.

      3 arquivos JA TEM conteudo real: prompt-strategy.md, base-system-prompt.md,
      classification-prompt.md.

