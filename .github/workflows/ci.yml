name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://sol_user:sol_password_test@localhost:5432/sol_db_test
  AUTH_SECRET: ci-test-secret-not-real
  NEXTAUTH_SECRET: ci-test-secret-not-real
  NEXTAUTH_URL: http://localhost:3000

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sol_user
          POSTGRES_PASSWORD: sol_password_test
          POSTGRES_DB: sol_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sol_user -d sol_db_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
