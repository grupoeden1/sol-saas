name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sol_user
          POSTGRES_PASSWORD: sol_password_test
          POSTGRES_DB: sol_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Apply migrations & generate Prisma Client
        run: pnpm run db:deploy
        env:
          DATABASE_URL: postgresql://sol_user:sol_password_test@localhost:5432/sol_db_test

      - name: Run linter
        run: pnpm run lint

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Build packages
        run: pnpm run build
        env:
          DATABASE_URL: postgresql://sol_user:sol_password_test@localhost:5432/sol_db_test
          NEXTAUTH_SECRET: test-secret-for-ci
          NEXTAUTH_URL: http://localhost:3000

  # Job de testes será adicionado quando houver testes (stories futuras)
