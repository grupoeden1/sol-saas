          Server Components via barrel export). Apenas queries Prisma e cálculos
          aritméticos puros.

          Exportar em index.ts com `export * from './admin'` — verificar se há
          conflito de nomes com outros módulos exportados.

      # ─── 2.4: Rota POST /api/admin/add-credits ───────────────────────────

      - id: "2.4"
        title: "Criar POST /api/admin/add-credits"
        service: backend
        files:
          - path: "apps/web/src/app/api/admin/add-credits/route.ts"
            action: CREATE

        currentState: |
          apps/web/src/app/api/admin/: NÃO EXISTE
          Pasta precisa ser criada junto com o arquivo.

        targetState: |
          apps/web/src/app/api/admin/add-credits/route.ts com:
          - Verificação de session + role ADMIN (403 se não)
          - Validação Zod: { userEmail: email, amountBRL: positive number, reason: min(3) }
          - Busca usuário por email (404 se não encontrado)
          - Conversão: amountCents = Math.round(amountBRL * 100)
          - Cotação via getExchangeRate("USD-BRL")
          - addCredits com type: 'adjustment'
          - Response: { success, userEmail, addedCents, newBalanceCents }

        actions:
          - "Criar diretório apps/web/src/app/api/admin/add-credits/"
          - "Criar route.ts com export async function POST(req: NextRequest)"
          - "Importar auth de @/lib/auth (verificar caminho exato — pode ser @/auth)"
          - "Importar z de zod para validação do body"
          - "Importar prisma de @sol/db para busca do usuário"
          - "Importar addCredits e getExchangeRate de @sol/db"
          - "Implementar verificação role ADMIN antes de qualquer lógica"
          - "Tratar erro de usuário não encontrado com 404 claro"

        implementation: |
          import { NextRequest, NextResponse } from 'next/server'
          import { z } from 'zod'
          import { auth } from '@/lib/auth'    // verificar caminho: pode ser '@/auth'
          import { prisma, addCredits, getExchangeRate } from '@sol/db'

          const bodySchema = z.object({
            userEmail: z.string().email('Email inválido'),
            amountBRL: z.number().positive('Valor deve ser positivo'),
            reason: z.string().min(3, 'Motivo deve ter pelo menos 3 caracteres').max(200),
          })

          export async function POST(req: NextRequest) {
            // 1. Auth + role check
            const session = await auth()
            if (!session?.user || (session.user as { role?: string }).role !== 'ADMIN') {
              return NextResponse.json({ error: 'Forbidden' }, { status: 403 })
            }

            // 2. Validação Zod
            let body: unknown
            try {
              body = await req.json()
            } catch {
              return NextResponse.json({ error: 'Body inválido' }, { status: 400 })
            }
            const parsed = bodySchema.safeParse(body)
            if (!parsed.success) {
              return NextResponse.json({ error: parsed.error.flatten() }, { status: 400 })
            }
            const { userEmail, amountBRL, reason } = parsed.data

            // 3. Buscar usuário pelo email
            const user = await prisma.user.findUnique({ where: { email: userEmail } })
            if (!user) {
              return NextResponse.json({ error: `Usuário não encontrado: ${userEmail}` }, { status: 404 })
            }

            // 4. Converter e obter cotação
            const amountCents = Math.round(amountBRL * 100)
            const exchangeRate = await getExchangeRate('USD-BRL')

            // 5. Adicionar créditos com auditoria
            const adminEmail = (session.user as { email?: string }).email ?? 'unknown'
            const { balanceCents } = await addCredits(user.id, amountCents, {
              type: 'adjustment',
              exchangeRate,
              adminEmail,
              description: `Ajuste manual por ${adminEmail}: ${reason}`,
            })

            console.log(
              `[Admin] addCredits(adjustment) admin=${adminEmail} target=${userEmail} cents=${amountCents}`
            )

            return NextResponse.json({
              success: true,
              userEmail,
              addedCents: amountCents,
              newBalanceCents: balanceCents,
            })
          }

        authImportNote: |
          VERIFICAR o caminho correto do import de auth:
          - Se admin/page.tsx usa `import { auth } from '@/lib/auth'` → usar o mesmo
          - Se usa `import { auth } from '@/auth'` → usar o mesmo
          Consistência com o padrão do projeto.

          O campo role na session pode requerer cast:
          `(session.user as { role?: string }).role`
          Verificar a tipagem do NextAuth no projeto (auth.ts ou types/next-auth.d.ts).

        verification:
          type: command
          command: "pnpm typecheck"

        status: pending
        dependencies:
          - "2.1"  # addCredits com nova assinatura

