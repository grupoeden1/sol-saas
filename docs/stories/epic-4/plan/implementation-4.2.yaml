# ─── Phases ──────────────────────────────────────────────────────────────────

phases:

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 1 — Database
  # Pré-requisito bloqueante para todas as demais fases.
  # Subtasks desta fase: apenas 1.1 (sequencial).
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "phase-1"
    name: "Database: Migration + Backfill"
    description: >
      Adicionar 'adjustment' ao enum TransactionType, campos grossAmountCents e
      adminEmail ao CreditTransaction. Backfill de grossAmountCents em purchases
      existentes. Bloqueante para todas as demais fases.
    canParallelize: false

    subtasks:

      # ─── 1.1: Migration Prisma ────────────────────────────────────────────

      - id: "1.1"
        title: "Migration: adjustment, grossAmountCents, adminEmail + backfill"
        service: database
        files:
          - path: "packages/db/prisma/schema.prisma"
            action: MODIFY
          - path: "packages/db/prisma/migrations/TIMESTAMP_admin_console/migration.sql"
            action: CREATE

        currentState: |
          enum TransactionType {
            purchase
            consumption
          }

          model CreditTransaction {
            // ... sem grossAmountCents e sem adminEmail
            stripePaymentId String? @unique
            exchangeRate    Decimal?
            // ...
          }

        targetState: |
          enum TransactionType {
            purchase
            consumption
            adjustment   // NOVO — adição manual pelo admin (sem Stripe)
          }

          model CreditTransaction {
            // ... campos existentes intocados ...
            grossAmountCents Int?    // NOVO — valor bruto pago no Stripe (apenas purchase)
            adminEmail       String? // NOVO — email do admin executor (apenas adjustment)
            // Adicionar também índice no type para queries de métricas financeiras:
            @@index([type])
          }

        actions:
          - "Em schema.prisma: adicionar `adjustment` ao enum TransactionType"
          - "Em schema.prisma: adicionar `grossAmountCents Int?` ao model CreditTransaction (após stripePaymentId)"
          - "Em schema.prisma: adicionar `adminEmail String?` ao model CreditTransaction (após grossAmountCents)"
          - "Em schema.prisma: adicionar `@@index([type])` ao model CreditTransaction"
          - "Criar migration interativa: cd packages/db && npx prisma migrate dev --name admin_console"
          - "Se o ambiente não suportar migrate dev interativo: usar migrate deploy após create-only"
          - "Verificar migration SQL gerada: deve conter apenas ALTER TABLE ADD COLUMN (não drop+recreate)"
          - "Executar backfill SQL manualmente ou incluir na migration como step adicional"
          - "Rodar: npx prisma generate para atualizar tipos"

        migrationSql: |
          -- Adicionar 'adjustment' ao enum TransactionType
          ALTER TYPE "TransactionType" ADD VALUE 'adjustment';

          -- Adicionar grossAmountCents (valor bruto pago no Stripe, nullable)
          ALTER TABLE "credit_transactions" ADD COLUMN "gross_amount_cents" INTEGER;

          -- Adicionar adminEmail (email do admin, apenas para adjustments, nullable)
          ALTER TABLE "credit_transactions" ADD COLUMN "admin_email" TEXT;

          -- Índice para queries financeiras (type filter frequente)
          CREATE INDEX "credit_transactions_type_idx" ON "credit_transactions"("type");

          -- Backfill: purchases existentes recebem grossAmountCents aproximado
          -- (amount = valor creditado = valor_bruto * CREDIT_PERCENTAGE)
          -- Inverso: valor_bruto = amount / CREDIT_PERCENTAGE (0.40)
          UPDATE "credit_transactions"
          SET "gross_amount_cents" = ROUND("amount"::numeric / 0.40)
          WHERE "type" = 'purchase'
            AND "gross_amount_cents" IS NULL;

        verification:
          type: command
          command: "cd packages/db && npx prisma validate && npx prisma generate"

        status: pending
        dependencies: []
        notes: |
          IMPORTANTE: O backfill usa CREDIT_PERCENTAGE=0.40 fixo. É uma
          aproximação do valor bruto original — suficiente para consistência
          histórica. Compras futuras terão o valor exato via session.amount_total.

          Campos nullable → zero impacto em dados existentes: purchases antigas
          não terão adminEmail (correto), consumptions não terão grossAmountCents
          (correto). Apenas o backfill preenche grossAmountCents em purchases.

          O enum PostgreSQL não suporta remoção de valores. Adicionar 'adjustment'
          é seguro e irreversível — aceitável para produção.

          Verificar no Prisma Studio após migration:
          - CreditTransaction tem colunas gross_amount_cents e admin_email
          - Purchases existentes têm gross_amount_cents preenchido (não null)
          - TransactionType aceita 'adjustment'

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 2 — Backend Core
  # Ordem obrigatória: 2.1 PRIMEIRO (addCredits refatorado).
  # Depois: 2.2 e 2.3 podem rodar em PARALELO (independentes entre si).
  # 2.4 (admin.ts) é independente de 2.1, 2.2 e 2.3 — pode rodar em paralelo.
  # TODAS dependem da Phase 1 (schema atualizado e tipos Prisma gerados).
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "phase-2"
    name: "Backend Core: addCredits, webhook, admin.ts, add-credits route"
    description: >
      Refatorar addCredits() para discriminated union (2.1 — bloqueante para 2.2 e 2.3).
      Atualizar webhook Stripe para grossAmountCents (2.2 — depende de 2.1).
      Criar módulo admin.ts com queries de métricas (2.3 — independente).
      Criar rota POST /api/admin/add-credits (2.4 — depende de 2.1).
    canParallelize: true  # 2.3 pode ser feito em paralelo com 2.1

    subtasks:

      # ─── 2.1: Refatorar addCredits() ─────────────────────────────────────

      - id: "2.1"
        title: "Refatorar addCredits() — discriminated union (purchase | adjustment)"
        service: backend
        files:
          - path: "packages/db/src/credits.ts"
            action: MODIFY

        currentState: |
          export async function addCredits(
            userId: string,
            amountCents: number,
            stripePaymentId: string,   // posicional — apenas purchase
            exchangeRate: Prisma.Decimal,
          ): Promise<{ balanceCents: number }>

          // Implementação: cria CreditTransaction com type: 'purchase',
          // description: 'Compra de créditos via Stripe', stripePaymentId, exchangeRate.
          // NÃO registra grossAmountCents.

        targetState: |
          export type AddCreditOptions =
            | {
                type: 'purchase'
                stripePaymentId: string
                exchangeRate: Prisma.Decimal
                grossAmountCents: number
              }
            | {
                type: 'adjustment'
                exchangeRate: Prisma.Decimal
                adminEmail: string
                description: string
              }

          export async function addCredits(
            userId: string,
            amountCents: number,
            options: AddCreditOptions,
          ): Promise<{ balanceCents: number }>

          // purchase: description auto, stripePaymentId, grossAmountCents preenchidos
          // adjustment: adminEmail, description do motivo, stripePaymentId/grossAmountCents null

        actions:
          - "Adicionar type export `AddCreditOptions` com discriminated union"
          - "Alterar assinatura de addCredits() para (userId, amountCents, options: AddCreditOptions)"
          - "Implementação purchase: manter $transaction existente, adicionar grossAmountCents ao create"
          - "Implementação adjustment: novo branch — sem stripePaymentId, com adminEmail e description"
          - "Garantir que idempotência via stripePaymentId UNIQUE permanece para purchases"

        implementation: |
          export type AddCreditOptions =
            | {
                type: 'purchase'
                stripePaymentId: string
                exchangeRate: Prisma.Decimal
                grossAmountCents: number
              }
            | {
                type: 'adjustment'
                exchangeRate: Prisma.Decimal
                adminEmail: string
                description: string
              }

          export async function addCredits(
            userId: string,
            amountCents: number,
            options: AddCreditOptions,
          ): Promise<{ balanceCents: number }> {
            const result = await prisma.$transaction(async (tx) => {
              const updated = await tx.user.update({
                where: { id: userId },
                data: { balanceCents: { increment: amountCents } },
                select: { balanceCents: true },
              })

              if (options.type === 'purchase') {
                await tx.creditTransaction.create({
                  data: {
                    userId,
                    amount: amountCents,
                    type: 'purchase',
                    description: 'Compra de créditos via Stripe',
                    stripePaymentId: options.stripePaymentId,
                    grossAmountCents: options.grossAmountCents,
                    exchangeRate: options.exchangeRate,
                  },
                })
              } else {
                await tx.creditTransaction.create({
                  data: {
                    userId,
                    amount: amountCents,
                    type: 'adjustment',
                    description: options.description,
                    adminEmail: options.adminEmail,
                    exchangeRate: options.exchangeRate,
                    stripePaymentId: null,
                    grossAmountCents: null,
                  },
                })
              }

              return updated.balanceCents
            })

            const label = options.type === 'purchase' ? 'purchase' : 'adjustment'
            console.log(`[Credits] addCredits(${label}) completed amountCents=${amountCents}`)
            return { balanceCents: result }
          }

        verification:
          type: command
          command: "pnpm typecheck"

        status: pending
        dependencies:
          - "1.1"
        notes: |
          ATENÇÃO: Após esta subtask, o webhook vai quebrar a build porque ainda
          chama addCredits() com a assinatura posicional antiga. Implementar
          subtask 2.2 imediatamente após — ou na mesma sessão de trabalho.

          O único caller atual de addCredits() é o webhook (route.ts linha 60).
          Não há outros callers no codebase.

      # ─── 2.2: Atualizar Webhook Stripe ───────────────────────────────────

      - id: "2.2"
        title: "Atualizar webhook Stripe — passar grossAmountCents com nova assinatura"
        service: backend
        files:
          - path: "apps/web/src/app/api/webhooks/stripe/route.ts"
            action: MODIFY

        currentState: |
          // Linha 35: amountTotal = session.amount_total  ← JÁ extraído ✓
          // Linha 60: await addCredits(userId, amountCents, stripePaymentId, exchangeRate)
          //           ← assinatura posicional ANTIGA — vai quebrar após 2.1

        targetState: |
          // Linha 35: amountTotal = session.amount_total  ← mantido
          // Chamada atualizada para nova assinatura:
          await addCredits(userId, amountCents, {
            type: 'purchase',
            stripePaymentId,
            exchangeRate,
            grossAmountCents: amountTotal,  // session.amount_total (já validado como not null)
          })

        actions:
          - "Substituir a chamada addCredits() posicional pela nova assinatura com options object"
          - "amountTotal já está extraído e validado (linha 37: if (!userId || !stripePaymentId || !amountTotal))"
          - "grossAmountCents = amountTotal — valor bruto que o Stripe cobrou do cliente"
          - "Nenhuma outra mudança no arquivo — validação, idempotência e logs mantidos"

        implementation: |
          // ANTES (linha 60):
          await addCredits(userId, amountCents, stripePaymentId, exchangeRate);

          // DEPOIS:
          await addCredits(userId, amountCents, {
            type: 'purchase',
            stripePaymentId,
            exchangeRate,
            grossAmountCents: amountTotal,
          });

        verification:
          type: command
          command: "pnpm typecheck"

        status: pending
        dependencies:
          - "2.1"
        notes: |
          amountTotal já é validado como not null (linha 37 do webhook atual).
          Não é necessário fallback adicional — o webhook já rejeita o evento
          com 400 se amount_total for null.

          Idempotência: a constraint UNIQUE em stripePaymentId permanece intacta.
          O catch P2002 no webhook não muda.

      # ─── 2.3: Criar packages/db/src/admin.ts ────────────────────────────

      - id: "2.3"
        title: "Criar admin.ts — módulo de queries de métricas"
        service: backend
        files:
          - path: "packages/db/src/admin.ts"
            action: CREATE
          - path: "packages/db/src/index.ts"
            action: MODIFY

        currentState: |
          packages/db/src/admin.ts: NÃO EXISTE
          packages/db/src/index.ts: exporta prisma, conversations, credits, exchange-rate
          // admin.ts não está exportado

        targetState: |
          packages/db/src/admin.ts: CRIADO com funções tipadas:
            - getUserMetrics()
            - getUsageMetrics()
            - getUsersList(page, pageSize)
            - getFinancialMetrics()
            - getExchangeMetrics()

          packages/db/src/index.ts: adicionar linha:
            export * from './admin'

        actions:
          - "Criar packages/db/src/admin.ts com todas as funções e interfaces exportadas"
          - "Implementar getUserMetrics() com 4 queries em Promise.all"
          - "Implementar getUsageMetrics() com 6 queries em Promise.all + cálculos no servidor"
          - "Implementar getUsersList(page, pageSize) com findMany + _count messages"
          - "Implementar getFinancialMetrics() com 6 queries (5 Prisma + 1 raw para custo OpenAI)"
          - "Implementar getExchangeMetrics() com 2 queries em Promise.all"
          - "Em index.ts: adicionar `export * from './admin'` ao final"

        implementation: |
          // packages/db/src/admin.ts
          import { prisma } from './index'

          const MIN_COST_CENTS = 100

          // ─── Types ──────────────────────────────────────────────────────

          export interface UserMetrics {
            totalUsers: number
            activeUsers7d: number         // ≥1 mensagem de role=user nos últimos 7 dias
            lowBalanceUsers: number       // balanceCents < MIN_COST_CENTS (100)
            newUsers30d: number
          }

          export interface UsageMetrics {
            totalMessages: number
            messagesToday: number
            messages7d: number
            totalInputTokens: number
            totalOutputTokens: number
            topModel: string              // ex: "gpt-4o"
            topModelPercent: number       // ex: 73.5
            avgTokensPerMessage: number
            messagesWithAttachments: number
            messagesWithoutAttachments: number
          }

          export interface FinancialMetrics {
            totalRevenueCents: number       // SUM(grossAmountCents) WHERE type='purchase'
            revenue30dCents: number
            totalOpenAICostBRL: number      // SUM(costUsd * exchangeRate) por transação
            grossProfitBRL: number          // revenue/100 - totalOpenAICostBRL
            grossMarginPercent: number      // profit/revenue*100
            markupPercent: number           // revenue/cost*100
            creditsSoldCents: number        // SUM(amount) WHERE type='purchase'
            creditsConsumedCents: number    // SUM(ABS(amount)) WHERE type='consumption'
            totalRetainedBalanceCents: number
          }

          export interface ExchangeMetrics {
            currentRate: number
            minRate30d: number
            maxRate30d: number
          }

          export interface UserRow {
            id: string
            email: string
            balanceCents: number
            totalMessages: number         // COUNT mensagens role=user
            createdAt: Date
          }

          export interface UsersPage {
            users: UserRow[]
            total: number
          }

          // ─── getUserMetrics ──────────────────────────────────────────────

          export async function getUserMetrics(): Promise<UserMetrics> {
            const now = new Date()
            const ago7d = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000)
            const ago30d = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000)

            const [totalUsers, activeUsers7d, lowBalanceUsers, newUsers30d] = await Promise.all([
              prisma.user.count(),
              prisma.user.count({
                where: {
                  conversations: {
                    some: {
                      messages: {
                        some: { role: 'user', createdAt: { gte: ago7d } },
                      },
                    },
                  },
                },
              }),
              prisma.user.count({ where: { balanceCents: { lt: MIN_COST_CENTS } } }),
              prisma.user.count({ where: { createdAt: { gte: ago30d } } }),
            ])

            return { totalUsers, activeUsers7d, lowBalanceUsers, newUsers30d }
          }

          // ─── getUsageMetrics ─────────────────────────────────────────────

          export async function getUsageMetrics(): Promise<UsageMetrics> {
            const now = new Date()
            const startOfToday = new Date(now); startOfToday.setHours(0,0,0,0)
            const ago7d = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000)

            const [
              totalMessages, messagesToday, messages7d,
              tokenStats, modelGroups, withAttachments, totalConsumptions,
            ] = await Promise.all([
              prisma.message.count({ where: { role: 'user' } }),
              prisma.message.count({ where: { role: 'user', createdAt: { gte: startOfToday } } }),
              prisma.message.count({ where: { role: 'user', createdAt: { gte: ago7d } } }),
              prisma.creditTransaction.aggregate({
                where: { type: 'consumption' },
                _sum: { inputTokens: true, outputTokens: true },
              }),
              prisma.creditTransaction.groupBy({
                by: ['modelUsed'],
                where: { type: 'consumption', modelUsed: { not: null } },
                _count: { id: true },
                orderBy: { _count: { id: 'desc' } },
              }),
              prisma.creditTransaction.count({
                where: { type: 'consumption', hasAttachments: true },
              }),
              prisma.creditTransaction.count({ where: { type: 'consumption' } }),
            ])

            const totalInput = tokenStats._sum.inputTokens ?? 0
            const totalOutput = tokenStats._sum.outputTokens ?? 0
            const topModelEntry = modelGroups[0]
            const topModel = topModelEntry?.modelUsed ?? 'N/A'
            const topModelCount = topModelEntry?._count.id ?? 0
            const topModelPercent = totalConsumptions > 0
              ? Math.round((topModelCount / totalConsumptions) * 100 * 10) / 10
              : 0
            const avgTokens = totalConsumptions > 0
              ? Math.round((totalInput + totalOutput) / totalConsumptions)
              : 0

            return {
              totalMessages,
              messagesToday,
              messages7d,
              totalInputTokens: totalInput,
              totalOutputTokens: totalOutput,
              topModel,
              topModelPercent,
              avgTokensPerMessage: avgTokens,
              messagesWithAttachments: withAttachments,
              messagesWithoutAttachments: totalConsumptions - withAttachments,
            }
          }

          // ─── getUsersList ────────────────────────────────────────────────

          export async function getUsersList(
            page: number,
            pageSize: number = 20,
          ): Promise<UsersPage> {
            const [rawUsers, total] = await Promise.all([
              prisma.user.findMany({
                skip: (page - 1) * pageSize,
                take: pageSize,
                orderBy: { createdAt: 'desc' },
                select: {
                  id: true,
                  email: true,
                  balanceCents: true,
                  createdAt: true,
                  _count: {
                    select: {
                      conversations: {
                        where: {
                          messages: { some: { role: 'user' } },
                        },
                      },
                    },
                  },
                },
              }),
              prisma.user.count(),
            ])

            // Total de mensagens por usuário nesta página
            const userIds = rawUsers.map((u) => u.id)
            const messageCounts = userIds.length > 0
              ? await prisma.message.groupBy({
                  by: ['conversationId'],
                  where: {
                    role: 'user',
                    conversation: { userId: { in: userIds } },
                  },
                  _count: { id: true },
                })
              : []

            // Alternativa mais simples se groupBy por userId não for suportado diretamente:
            // usar $queryRaw para COUNT(messages) GROUP BY conversations.user_id
            // Ver nota de implementação abaixo.

            const users: UserRow[] = rawUsers.map((u) => ({
              id: u.id,
              email: u.email,
              balanceCents: u.balanceCents,
              totalMessages: 0, // placeholder — ver nota
              createdAt: u.createdAt,
            }))

            return { users, total }
          }

          // NOTA getUsersList:
          // Prisma não suporta groupBy em relações aninhadas diretamente.
          // Alternativa recomendada para totalMessages por usuário:
          //
          // const msgCounts = await prisma.$queryRaw<Array<{userId: string, cnt: bigint}>>`
          //   SELECT c.user_id as "userId", COUNT(m.id) as cnt
          //   FROM messages m
          //   JOIN conversations c ON m.conversation_id = c.id
          //   WHERE m.role = 'user' AND c.user_id = ANY(${userIds}::text[])
          //   GROUP BY c.user_id
          // `
          // const msgMap = new Map(msgCounts.map(r => [r.userId, Number(r.cnt)]))
          // Usar Number(r.cnt) para converter bigint do PostgreSQL.

          // ─── getFinancialMetrics ─────────────────────────────────────────

          export async function getFinancialMetrics(): Promise<FinancialMetrics> {
            const ago30d = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000)

            const [
              revenueAll,
              revenue30d,
              costResult,
              creditsSold,
              creditsConsumed,
              retainedBalance,
            ] = await Promise.all([
              prisma.creditTransaction.aggregate({
                where: { type: 'purchase' },
                _sum: { grossAmountCents: true },   // IMPORTANTE: grossAmountCents, não amount
              }),
              prisma.creditTransaction.aggregate({
                where: { type: 'purchase', createdAt: { gte: ago30d } },
                _sum: { grossAmountCents: true },
              }),
              // RAW QUERY: Prisma aggregate não suporta multiplicação de campos
              prisma.$queryRaw<[{ total_cost_brl: number }]>`
                SELECT COALESCE(
                  SUM(CAST("costUsd" AS FLOAT) * CAST("exchangeRate" AS FLOAT)), 0
                ) AS total_cost_brl
                FROM "CreditTransaction"
                WHERE "type" = 'consumption'
                  AND "costUsd" IS NOT NULL
                  AND "exchangeRate" IS NOT NULL
              `,
              prisma.creditTransaction.aggregate({
                where: { type: 'purchase' },
                _sum: { amount: true },
              }),
              prisma.creditTransaction.aggregate({
                where: { type: 'consumption' },
                _sum: { amount: true },  // negativo → Math.abs()
              }),
              prisma.user.aggregate({ _sum: { balanceCents: true } }),
            ])

            const totalRevenueCents = revenueAll._sum.grossAmountCents ?? 0
            const revenue30dCents = revenue30d._sum.grossAmountCents ?? 0
            const totalOpenAICostBRL = Number(costResult[0]?.total_cost_brl ?? 0)
            const revenueBRL = totalRevenueCents / 100
            const grossProfitBRL = revenueBRL - totalOpenAICostBRL
            const grossMarginPercent = revenueBRL > 0
              ? Math.round((grossProfitBRL / revenueBRL) * 100 * 10) / 10
              : 0
            const markupPercent = totalOpenAICostBRL > 0
              ? Math.round((revenueBRL / totalOpenAICostBRL) * 100 * 10) / 10
              : 0

            return {
              totalRevenueCents,
              revenue30dCents,
              totalOpenAICostBRL,
              grossProfitBRL,
              grossMarginPercent,
              markupPercent,
              creditsSoldCents: creditsSold._sum.amount ?? 0,
              creditsConsumedCents: Math.abs(creditsConsumed._sum.amount ?? 0),
              totalRetainedBalanceCents: retainedBalance._sum.balanceCents ?? 0,
            }
          }

          // ─── getExchangeMetrics ──────────────────────────────────────────

          export async function getExchangeMetrics(): Promise<ExchangeMetrics> {
            const ago30d = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000)

            const [latest, range] = await Promise.all([
              prisma.exchangeRate.findFirst({
                where: { currency: 'USD-BRL' },
                orderBy: { date: 'desc' },
              }),
              prisma.exchangeRate.aggregate({
                where: { currency: 'USD-BRL', date: { gte: ago30d } },
                _min: { rate: true },
                _max: { rate: true },
              }),
            ])

            return {
              currentRate: Number(latest?.rate ?? 0),
              minRate30d: Number(range._min.rate ?? 0),
              maxRate30d: Number(range._max.rate ?? 0),
            }
          }

        rawQueryNote: |
          NOME DA TABELA no raw query: verificar se Prisma usa "CreditTransaction" (PascalCase)
          ou "credit_transactions" (snake_case) — depende da configuração do datasource.
          Se o schema não tem @@map, Prisma usa o nome do model em PascalCase.
          Verificar no Prisma Studio ou via: SELECT tablename FROM pg_tables WHERE schemaname='public'

          COLUNAS: Prisma usa camelCase no TypeScript, mas snake_case no PostgreSQL por padrão.
          Verificar nomes reais das colunas: costUsd → "cost_usd", exchangeRate → "exchange_rate".
          Ajustar o raw query conforme necessário.

        verification:
