# ─────────────────────────────────────────────────────────────────────────────
# Story 4.2 — Admin Console: Métricas Operacionais e Financeiras
# Implementation Plan
# ─────────────────────────────────────────────────────────────────────────────
#
# CONTEXTO: Story 4.1 (autenticação admin + tabela básica de usuários) está
# concluída. Este plano implementa o DELTA para o Admin Console completo:
#
# Delta-chave:
#   1. Schema: 'adjustment' no enum, grossAmountCents e adminEmail no CreditTransaction
#   2. addCredits(): refatorar para discriminated union (purchase | adjustment)
#   3. Webhook Stripe: passar grossAmountCents via session.amount_total (já extraído)
#   4. packages/db/src/admin.ts: novo módulo com todas as queries de métricas
#   5. POST /api/admin/add-credits: nova rota com validação Zod + auditoria
#   6. /admin page.tsx: rewrite com métricas reais completas
#   7. AddCreditsForm: Client Component com dialog de confirmação
#
# O que NÃO muda: chat, streaming SSE, autenticação, painel do aluno,
# Stripe Checkout. A experiência do aluno é intocada.
#
# Estado atual crítico:
#   - admin/page.tsx: JÁ usa Promise.all e dados reais, MAS usa `amount` para
#     receita (precisa ser grossAmountCents) e falta métricas completas
#   - webhook: JÁ extrai `amountTotal = session.amount_total` (linha 35),
#     MAS chama addCredits() com assinatura antiga (linha 60)
#   - addCredits(): assinatura posicional → precisa virar discriminated union
# ─────────────────────────────────────────────────────────────────────────────

