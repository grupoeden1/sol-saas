          - "Integrar com sistema de toast existente no projeto"
          - "Usar router.refresh() após sucesso para revalidar dados do Server Component"

        implementation: |
          'use client'

          import { useState } from 'react'
          import { useRouter } from 'next/navigation'
          // Ajustar imports conforme libs disponíveis no projeto:
          import {
            Dialog, DialogContent, DialogHeader, DialogTitle,
            DialogDescription, DialogFooter,
          } from '@/components/ui/dialog'
          import { Button } from '@/components/ui/button'
          import { Input } from '@/components/ui/input'
          import { Label } from '@/components/ui/label'

          export function AddCreditsForm() {
            const router = useRouter()
            const [open, setOpen] = useState(false)
            const [loading, setLoading] = useState(false)
            const [error, setError] = useState<string | null>(null)
            const [form, setForm] = useState({ userEmail: '', amountBRL: '', reason: '' })

            function handleChange(e: React.ChangeEvent<HTMLInputElement>) {
              setForm((prev) => ({ ...prev, [e.target.name]: e.target.value }))
            }

            function handleSubmit(e: React.FormEvent) {
              e.preventDefault()
              setError(null)
              if (!form.userEmail || !form.amountBRL || !form.reason) {
                setError('Preencha todos os campos')
                return
              }
              setOpen(true)
            }

            async function handleConfirm() {
              setLoading(true)
              setError(null)
              try {
                const res = await fetch('/api/admin/add-credits', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    userEmail: form.userEmail,
                    amountBRL: parseFloat(form.amountBRL),
                    reason: form.reason,
                  }),
                })
                const data = await res.json()
                if (!res.ok) {
                  throw new Error(
                    typeof data.error === 'string'
                      ? data.error
                      : 'Erro ao adicionar créditos'
                  )
                }
                // Toast de sucesso — adaptar à lib disponível:
                alert(`R$ ${form.amountBRL} adicionados ao saldo de ${form.userEmail}`)
                setForm({ userEmail: '', amountBRL: '', reason: '' })
                setOpen(false)
                router.refresh()
              } catch (err) {
                setError(err instanceof Error ? err.message : 'Erro inesperado')
              } finally {
                setLoading(false)
              }
            }

            const amountBRL = parseFloat(form.amountBRL) || 0

            return (
              <div className="rounded-2xl border border-solar-800/20 bg-background-secondary/40 p-6 backdrop-blur-md">
                <h2 className="mb-4 text-lg font-semibold text-foreground">Adicionar Créditos</h2>
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <Label htmlFor="userEmail">Email do Usuário</Label>
                    <Input
                      id="userEmail" name="userEmail" type="email"
                      value={form.userEmail} onChange={handleChange}
                      placeholder="aluno@exemplo.com"
                    />
                  </div>
                  <div>
                    <Label htmlFor="amountBRL">Valor em R$ (reais)</Label>
                    <Input
                      id="amountBRL" name="amountBRL" type="number"
                      min="0.01" step="0.01"
                      value={form.amountBRL} onChange={handleChange}
                      placeholder="10.00"
                    />
                  </div>
                  <div>
                    <Label htmlFor="reason">Motivo</Label>
                    <Input
                      id="reason" name="reason" type="text"
                      value={form.reason} onChange={handleChange}
                      placeholder="Bônus de boas-vindas"
                    />
                  </div>
                  {error && (
                    <p className="text-sm text-red-400">{error}</p>
                  )}
                  <Button type="submit" className="w-full">
                    Adicionar Créditos
                  </Button>
                </form>

                <Dialog open={open} onOpenChange={setOpen}>
                  <DialogContent>
                    <DialogHeader>
                      <DialogTitle>Confirmar adição de créditos</DialogTitle>
                      <DialogDescription>
                        Esta ação adicionará créditos diretamente ao saldo do aluno,
                        sem passar pelo Stripe.
                      </DialogDescription>
                    </DialogHeader>
                    <div className="py-4 text-sm text-foreground">
                      <p>
                        Adicionar <strong>R$ {amountBRL.toFixed(2)}</strong> ao saldo de{' '}
                        <strong>{form.userEmail}</strong>?
                      </p>
                      <p className="mt-2 text-foreground-muted">
                        Motivo: {form.reason}
                      </p>
                    </div>
                    {error && (
                      <p className="text-sm text-red-400">{error}</p>
                    )}
                    <DialogFooter>
                      <Button
                        variant="outline"
                        onClick={() => setOpen(false)}
                        disabled={loading}
                      >
                        Cancelar
                      </Button>
                      <Button onClick={handleConfirm} disabled={loading}>
                        {loading ? 'Adicionando...' : 'Confirmar'}
                      </Button>
                    </DialogFooter>
                  </DialogContent>
                </Dialog>
              </div>
            )
          }

