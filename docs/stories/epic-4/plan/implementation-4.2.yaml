        targetState: |
          Client Component 'use client' com:
          - Form: email (text), valor em R$ (number step=0.01), motivo (text)
          - Ao submeter: abre Dialog de confirmação (Shadcn/UI)
          - Dialog exibe: "Adicionar R$ X,XX ao saldo de [email]? Motivo: [motivo]"
          - Botões: Cancelar | Confirmar (loading state durante fetch)
          - Fetch: POST /api/admin/add-credits
          - Sucesso: toast + limpa form + router.refresh()
          - Erro: toast com mensagem do erro

        actions:
          - "Verificar se Shadcn Dialog está instalado: ls apps/web/src/components/ui/dialog.tsx"
