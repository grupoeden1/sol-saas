# ─────────────────────────────────────────────────────────────────────────────
# Story P.3 — Atualizar Admin Console (Métricas)
# Implementation Plan v1
# ─────────────────────────────────────────────────────────────────────────────
#
# CONTEXTO: Story P.1 migrou User.balanceCents → User.credits e removeu a
# tabela exchange_rates. O admin console (/admin, Story 4.2) ainda referencia
# o modelo anterior em métricas de usuários, financeiras, cotação e adição
# manual de créditos. Esta story atualiza tudo para consistência.
#
# Dependência: Story P.1 deve estar COMPLETA antes de iniciar P.3.
# Paralelo com: Story P.2 (Pricing Admin Panel) — independente.
#
# Mudanças-chave:
#   1. "Sem saldo útil" = credits = 0 (era balanceCents < MIN_COST_CENTS)
#   2. Lista de usuários: créditos inteiros (não R$)
#   3. Receita: JOIN com credit_packages (não grossAmountCents)
#   4. Custo OpenAI: estimado via tokens (não costUsd × exchangeRate)
#   5. Remover seção de cotação → link para /admin/pricing
#   6. Adição manual: créditos inteiros (não reais)
# ─────────────────────────────────────────────────────────────────────────────

storyId: "story-P.3"
createdAt: "2026-03-03T20:00:00Z"
createdBy: "@architect"
status: pending
complexity: STANDARD
estimatedEffort: "2-3 days"

# ─── Dependencies ────────────────────────────────────────────────────────────

dependencies:
  - name: zod
    version: "^3.x"
    purpose: "Validação de input na API route add-credits (já instalado)"
    install: "N/A — já instalado"

# ─── Phases ──────────────────────────────────────────────────────────────────

phases:

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 1 — Queries: métricas de usuários + métricas financeiras
  # Subtasks podem ser executadas em PARALELO (mesmo arquivo mas funções independentes).
  # Dependem de P.1 (User.credits, tabelas novas, tabelas removidas).
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "phase-1"
    name: "Queries: métricas de usuários + financeiras"
    description: >
      Atualizar funções de métricas em packages/db/src/admin.ts.
      getUserMetrics: credits = 0 (não balanceCents < MIN_COST_CENTS).
      getFinancialMetrics: receita via JOIN, custo via tokens.
      Subtasks 1.1 e 1.2 são PARALELAS — funções independentes no mesmo arquivo.

    subtasks:

      # ─── 1.1: Métricas de usuários ──────────────────────────────────────

      - id: "1.1"
        title: "Atualizar getUserMetrics e getUsersPage — créditos"
        service: backend
        files:
          - path: "packages/db/src/admin.ts"
            action: MODIFY
        currentState: |
          - getUserMetrics(): lowBalanceUsers usa `balanceCents < MIN_COST_CENTS`
          - getUsersPage(): select inclui `balanceCents`, não `credits`
          - Saldo total retido: `_sum: { balanceCents: true }`
          - Interface UserMetrics: lowBalanceUsers
          - Interface UserRow: balanceCents
        targetState: |
          - getUserMetrics(): usersWithoutCredits usa `credits: { equals: 0 }`
          - getUsersPage(): select inclui `credits`
          - Saldo total retido: `_sum: { credits: true }` → totalRetainedCredits
          - Interface UserMetrics: usersWithoutCredits (renamed)
          - Interface UserRow: credits (renamed)
        actions:
          - "Renomear lowBalanceUsers → usersWithoutCredits na interface UserMetrics"
          - "Alterar query: `prisma.user.count({ where: { credits: { equals: 0 } } })`"
          - "Atualizar getUsersPage: select credits (não balanceCents)"
          - "Renomear balanceCents → credits na interface UserRow"
          - "Atualizar saldo total retido: `prisma.user.aggregate({ _sum: { credits: true } })`"
          - "Remover referência a MIN_COST_CENTS"
        verification:
          type: command
          command: "cd c:/Projetos/Sol/sol-saas && pnpm --filter db exec tsc --noEmit"
        status: pending
        dependencies: []
        notes: |
          DELTA:
          ```typescript
          // Interface — ANTES:
          export interface UserMetrics {
            totalUsers: number
            activeUsers7d: number
            lowBalanceUsers: number
            newUsers30d: number
          }

          // Interface — DEPOIS:
          export interface UserMetrics {
            totalUsers: number
            activeUsers7d: number
            usersWithoutCredits: number  // credits = 0
            newUsers30d: number
          }

          // Query — ANTES:
          prisma.user.count({ where: { balanceCents: { lt: MIN_COST_CENTS } } })

          // Query — DEPOIS:
          prisma.user.count({ where: { credits: { equals: 0 } } })
          ```

          NOTA: Renomear o campo no interface pode quebrar consumidores na page.tsx.
          Será corrigido na Phase 2 (subtask 2.1).

      # ─── 1.2: Métricas financeiras ──────────────────────────────────────

      - id: "1.2"
        title: "Atualizar getFinancialMetrics — receita via JOIN, custo via tokens"
        service: backend
        files:
          - path: "packages/db/src/admin.ts"
            action: MODIFY
        currentState: |
          - Receita: SUM(grossAmountCents) WHERE type = 'purchase'
          - Custo OpenAI: SUM(costUsd × exchangeRate) via raw query
          - Interface FinancialMetrics: totalRevenueCents, totalOpenAICostBRL, grossProfitBRL,
            grossMarginPercent, markupPercent, creditsSoldCents, creditsConsumedCents,
            totalRetainedBalanceCents
          - Depende de grossAmountCents, costUsd, exchangeRate em CreditTransaction
        targetState: |
          - Receita: JOIN credit_transactions com credit_packages (amount = credits → priceInCents)
          - Custo OpenAI: SUM((input_tokens/1M × $2.50) + (output_tokens/1M × $10.00)) via raw query
          - Interface FinancialMetrics: totalRevenueCents, revenue30dCents, estimatedOpenAICostUsd,
            creditsSold, creditsConsumed, totalRetainedCredits
          - Lucro/margem/markup calculados no frontend com cotação informada pelo admin
          - Sem referência a grossAmountCents, costUsd, exchangeRate
        actions:
          - "Reescrever query de receita: raw query com JOIN credit_transactions x credit_packages"
          - "Reescrever query de custo OpenAI: SUM((input_tokens/1M × 2.50) + (output_tokens/1M × 10.00))"
          - "Atualizar interface FinancialMetrics"
          - "Remover cálculos de lucro/margem/markup da função (mover para frontend)"
          - "Adicionar query revenue30dCents com filtro de data"
          - "Atualizar creditsSold e creditsConsumed (amount em créditos, não centavos)"
          - "totalRetainedCredits via SUM(credits) de users"
          - "Remover imports de getExchangeRate e ExchangeRate"
        verification:
          type: command
          command: "cd c:/Projetos/Sol/sol-saas && pnpm --filter db exec tsc --noEmit"
        status: pending
        dependencies: []
        notes: |
          Query de receita (raw SQL):
          ```sql
          SELECT COALESCE(SUM(cp.price_in_cents), 0) AS total_revenue_cents
          FROM credit_transactions ct
          JOIN credit_packages cp ON ct.amount = cp.credits
          WHERE ct.type = 'purchase'
          ```

          NOTA: JOIN por `amount = credits` é uma aproximação que funciona enquanto
          os pacotes não mudam de valor de créditos. Para precisão futura, considerar
          guardar packageId na CreditTransaction (melhoria futura).

          Query de custo estimado (raw SQL):
          ```sql
          SELECT COALESCE(
            SUM(
              (COALESCE(input_tokens, 0)::float / 1000000.0 * 2.50) +
              (COALESCE(output_tokens, 0)::float / 1000000.0 * 10.00)
            ), 0
          ) AS estimated_cost_usd
          FROM credit_transactions
          WHERE type = 'consumption'
            AND input_tokens IS NOT NULL
          ```

          Pricing GPT-4o (hardcoded — atualizar quando API pricing mudar):
          - Input: $2.50 / 1M tokens
          - Output: $10.00 / 1M tokens

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 2 — UI: remover cotação + atualizar adição manual + page
  # Subtasks podem ser executadas em PARALELO.
  # Dependem da Phase 1 (interfaces atualizadas).
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "phase-2"
    name: "UI: remover cotação + adição manual + page"
    description: >
      Remover seção de métricas de cotação, substituir por link para /admin/pricing.
      Atualizar formulário de adição manual (créditos em vez de reais).
      Atualizar página /admin para usar novas interfaces.
      Subtasks 2.1, 2.2 e 2.3 são PARALELAS.

    subtasks:

      # ─── 2.1: Remover métricas de cotação ────────────────────────────────

      - id: "2.1"
        title: "Remover getExchangeMetrics e seção de cotação na page"
        service: backend
        files:
          - path: "packages/db/src/admin.ts"
            action: MODIFY
          - path: "packages/db/src/index.ts"
            action: MODIFY
          - path: "apps/web/src/app/admin/page.tsx"
            action: MODIFY
        currentState: |
          - getExchangeMetrics() existe em admin.ts (query exchange_rates)
          - ExchangeMetrics interface existe
          - Ambos exportados em index.ts
          - page.tsx: Promise.all inclui getExchangeMetrics()
          - page.tsx: seção de cotação com 3 MetricCards (atual, min 30d, max 30d)
        targetState: |
          - getExchangeMetrics() REMOVIDA
          - ExchangeMetrics interface REMOVIDA
          - Exports removidos de index.ts
          - page.tsx: Promise.all SEM getExchangeMetrics
          - page.tsx: seção de cotação substituída por card com link para /admin/pricing
          - page.tsx: consumir novas interfaces (usersWithoutCredits, credits, etc.)
        actions:
          - "Remover função getExchangeMetrics() de admin.ts"
          - "Remover interface ExchangeMetrics de admin.ts"
          - "Remover exports de getExchangeMetrics e ExchangeMetrics de index.ts"
          - "Na page.tsx: remover getExchangeMetrics do Promise.all"
          - "Na page.tsx: remover destructuring de exchangeMetrics"
          - "Na page.tsx: substituir seção de cotação por card com Link para /admin/pricing"
          - "Na page.tsx: atualizar consumo das interfaces renomeadas (lowBalanceUsers → usersWithoutCredits, etc.)"
        verification:
          type: command
          command: "cd c:/Projetos/Sol/sol-saas && pnpm --filter web exec tsc --noEmit"
        status: pending
        dependencies:
          - "1.1"
          - "1.2"
        notes: |
          Card substituto:
          ```tsx
          <Card>
            <CardHeader>
              <CardTitle>Precificação</CardTitle>
            </CardHeader>
            <CardContent>
              <p className="text-sm text-muted-foreground mb-3">
                Gerencie constantes de precificação, pacotes e simule cenários.
              </p>
              <Link
                href="/admin/pricing"
                className="text-amber-400 hover:text-amber-300 font-medium"
              >
                Gerenciar Precificação →
              </Link>
            </CardContent>
          </Card>
          ```

          NOTA: O link para /admin/pricing funcionará mesmo que P.2 não esteja
          implementado ainda — Next.js mostrará 404 temporariamente.

      # ─── 2.2: Atualizar adição manual de créditos ────────────────────────

      - id: "2.2"
        title: "Atualizar add-credits API e AddCreditsForm — créditos inteiros"
        service: backend
        files:
          - path: "apps/web/src/app/api/admin/add-credits/route.ts"
            action: MODIFY
          - path: "apps/web/src/components/admin/AddCreditsForm.tsx"
            action: MODIFY
        currentState: |
          - API: schema Zod espera amountBRL (float)
          - API: converte para amountCents, busca exchangeRate
          - API: addCredits com { type: 'adjustment', exchangeRate, ... }
          - Form: label "Valor em R$", input step 0.01
          - Form: body envia amountBRL
          - Form: confirmação "Adicionar R$ X,XX ao saldo de [email]?"
          - Form: toast "R$ X,XX adicionados..."
        targetState: |
          - API: schema Zod espera credits (int positivo)
          - API: sem conversão, sem exchangeRate
          - API: addCredits com { type: 'adjustment', adminEmail, description }
          - API: retorna { success, userEmail, addedCredits, newCredits }
          - Form: label "Créditos a adicionar", input step 1
          - Form: body envia credits (int)
          - Form: confirmação "Adicionar X créditos ao saldo de [email]?"
          - Form: toast "X créditos adicionados..."
        actions:
          - "API: atualizar schema Zod: amountBRL → credits: z.number().int().positive()"
          - "API: remover conversão amountCents = Math.round(amountBRL * 100)"
          - "API: remover import e chamada de getExchangeRate"
          - "API: chamar addCredits(user.id, parsed.data.credits, { type: 'adjustment', adminEmail, description })"
          - "API: retornar { success, userEmail, addedCredits: parsed.data.credits, newCredits }"
          - "Form: label 'Créditos a adicionar'"
          - "Form: input type number step 1 (inteiro)"
          - "Form: body envia { userEmail, credits: parseInt(form.credits), reason }"
          - "Form: confirmação 'Adicionar X créditos ao saldo de [email]?'"
          - "Form: toast 'X créditos adicionados ao saldo de email'"
        verification:
          type: command
          command: "cd c:/Projetos/Sol/sol-saas && pnpm --filter web exec tsc --noEmit"
        status: pending
        dependencies:
          - "1.1"
        notes: |
          DELTA da API:
          ```typescript
          // Schema — ANTES:
          const schema = z.object({
            userEmail: z.string().email(),
            amountBRL: z.number().positive(),
            reason: z.string().min(3).max(200),
          })

          // Schema — DEPOIS:
          const schema = z.object({
            userEmail: z.string().email(),
            credits: z.number().int().positive(),
            reason: z.string().min(3).max(200),
          })

          // Lógica — ANTES:
          const amountCents = Math.round(amountBRL * 100)
          const exchangeRate = await getExchangeRate('USD-BRL')
          const { balanceCents } = await addCredits(user.id, amountCents, {
            type: 'adjustment', exchangeRate, adminEmail, description
          })

          // Lógica — DEPOIS:
          const { credits: newCredits } = await addCredits(user.id, parsed.data.credits, {
            type: 'adjustment',
            adminEmail: session.user.email!,
            description: `Ajuste manual por ${session.user.email}: ${parsed.data.reason}`,
          })
          ```

      # ─── 2.3: Atualizar componentes de UI ────────────────────────────────

      - id: "2.3"
        title: "Atualizar UsersTable e MetricCard — créditos"
        service: frontend
        files:
          - path: "apps/web/src/components/admin/UsersTable.tsx"
            action: MODIFY
          - path: "apps/web/src/components/admin/MetricCard.tsx"
