          - MetricCard: label "Saldo Insuficiente" ou similar para lowBalanceUsers
        targetState: |
          - UsersTable: coluna "Saldo" mostra credits inteiro (ex: "47 créditos")
          - MetricCard: label "Sem Créditos" para usersWithoutCredits
          - Saldo total retido: exibido em créditos
        actions:
          - "UsersTable: substituir formatBalance(user.balanceCents) por user.credits + ' créditos'"
          - "UsersTable: renomear prop/tipo de balanceCents para credits"
          - "MetricCard: atualizar label de lowBalanceUsers para 'Sem Créditos' (usersWithoutCredits)"
          - "MetricCard: saldo retido em créditos (não R$)"
        verification:
          type: command
          command: "cd c:/Projetos/Sol/sol-saas && pnpm --filter web exec tsc --noEmit"
        status: pending
        dependencies:
          - "1.1"
        notes: |
          Verificar se há um componente de formatação centralizado (formatBalance)
          que precisa ser atualizado ou se cada componente formata localmente.

          Se existe formatBalance em lib/format-balance.ts, pode ser necessário
          criar formatCredits ou atualizar a função (já pode ter sido feito em P.1).

