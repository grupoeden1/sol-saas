# ─── Risk Assessment ─────────────────────────────────────────────────────────

risks:
  - id: "R1"
    description: "JOIN credit_transactions com credit_packages por amount = credits pode ser impreciso se pacotes mudam"
    severity: MEDIUM
    mitigation: |
      Aceitável para MVP — pacotes iniciais (100, 500, 1200) são únicos.
      Melhoria futura: guardar packageId na CreditTransaction.
    affectedSubtasks: ["1.2"]

  - id: "R2"
    description: "Custo OpenAI estimado via tokens pode divergir do custo real (preços da API mudam)"
    severity: LOW
    mitigation: "Constantes de pricing hardcoded ($2.50 input, $10.00 output). Atualizar quando API pricing mudar."
    affectedSubtasks: ["1.2"]

  - id: "R3"
    description: "Cotação manual na UI pode confundir admin"
    severity: LOW
    mitigation: "Label claro: 'Informe a cotação atual do dólar para cálculos de custo'. Campo opcional."
    affectedSubtasks: ["2.1"]

  - id: "R4"
    description: "Remoção de getExchangeMetrics pode quebrar imports não detectados"
    severity: LOW
    mitigation: "Grep completo em 3.2 valida zero referências residuais. TypeScript typecheck pegaria erros de import."
    affectedSubtasks: ["2.1"]

  - id: "R5"
    description: "Renomear interface fields (lowBalanceUsers → usersWithoutCredits) pode quebrar page.tsx"
    severity: LOW
    mitigation: "TypeScript typecheck na 3.1 detecta quebras. Corrigidas na subtask 2.1."
    affectedSubtasks: ["1.1", "2.1"]

