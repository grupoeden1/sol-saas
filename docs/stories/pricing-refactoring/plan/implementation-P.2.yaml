# ─── Risk Assessment ─────────────────────────────────────────────────────────

risks:
  - id: "R1"
    description: "Simulador pode ficar lento com muitos cálculos em tempo real"
    severity: LOW
    mitigation: "Usar useMemo para cálculos derivados. Debounce em inputs se necessário."
    affectedSubtasks: ["2.1"]

  - id: "R2"
    description: "Admin pode salvar valores incorretos (ex: CREDITS_PER_M_OUTPUT = 0)"
    severity: MEDIUM
    mitigation: "Validação Zod: z.number().int().positive(). Dialog de confirmação obrigatória."
    affectedSubtasks: ["1.1", "2.1"]

  - id: "R3"
    description: "Cache invalidation pode não funcionar em deploy multi-instance"
    severity: LOW
    mitigation: "No MVP, single instance (VPS). Se escalar, considerar Redis pub/sub."
    affectedSubtasks: ["1.1"]

  - id: "R4"
    description: "Cotação do stress test pode confundir admin (não é salva)"
    severity: LOW
    mitigation: "Label claro e destacado: 'NÃO salva no banco — apenas simulação'."
    affectedSubtasks: ["2.1"]

  - id: "R5"
    description: "Shadcn/UI Dialog pode não estar instalado"
    severity: LOW
    mitigation: "Verificar components/ui/dialog.tsx. Se ausente: npx shadcn-ui@latest add dialog."
    affectedSubtasks: ["2.1"]

  - id: "R6"
    description: "Muitos Client Components podem aumentar bundle size"
    severity: LOW
    mitigation: "Code splitting automático do Next.js. Lazy load de seções secundárias (StressTest, PricingExplainer)."
    affectedSubtasks: ["2.1"]

