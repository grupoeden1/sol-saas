# ─── Risk Assessment ─────────────────────────────────────────────────────────

risks:
  - id: "R1"
    description: "Conversão de saldos existentes (balanceCents → credits) pode perder dados ou precisão"
    severity: HIGH
    mitigation: |
      Backup completo do banco antes da migration em produção.
      Migration renomeia coluna (preserva valores). Conversão de centavos para créditos
      discutida com PO antes de produção. Em dev, pode resetar saldos.
    affectedSubtasks: ["1.1"]

  - id: "R2"
    description: "Drop da tabela exchange_rates é irreversível"
    severity: MEDIUM
    mitigation: "Backup antes de drop. Validar em staging. Dados históricos não são necessários no novo modelo."
    affectedSubtasks: ["1.1"]

  - id: "R3"
    description: "Remoção de exchange-rate.ts quebra imports em múltiplos arquivos simultaneamente"
    severity: MEDIUM
    mitigation: |
      Phase 3 (cleanup) é executada ANTES da Phase 4 (routes) deliberadamente.
      TypeScript vai reportar erros — são corrigidos na Phase 4.
      Alternativa: renomear/esvaziar o arquivo em vez de deletar (tombstone).
    affectedSubtasks: ["3.1", "4.1", "4.2"]

  - id: "R4"
    description: "Cache de 60s do pricing config pode causar inconsistência temporária"
    severity: LOW
    mitigation: "Aceitável para MVP. Admin é avisado que mudanças levam até 60s. invalidatePricingConfigCache() para mudanças via admin."
    affectedSubtasks: ["2.1"]

  - id: "R5"
    description: "Remoção de grossAmountCents perde dados de auditoria histórica"
    severity: MEDIUM
    mitigation: |
      Alternativa: tornar nullable e deprecated em vez de remover.
      Se dropado, backup preserva dados. Novo modelo calcula receita via JOIN com credit_packages.
    affectedSubtasks: ["1.1"]

  - id: "R6"
    description: "Frontend e backend desacoplados — badge pode mostrar valor errado transitoriamente"
    severity: LOW
    mitigation: "Frontend consome header X-Credits-Remaining e done event creditsRemaining. Ambos atualizados na mesma release."
    affectedSubtasks: ["4.1", "5.1"]

