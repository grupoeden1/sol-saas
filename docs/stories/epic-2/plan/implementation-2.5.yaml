             const attachmentTokens = processedFiles.reduce((sum, f) => sum + f.tokens, 0)
             const totalInputTokens = inputTokens + attachmentTokens
             // Usar totalInputTokens no gate e na dedução
             ```

          7. Payload OpenAI com imagens (content array):
             ```typescript
             // Para a mensagem do user, montar content array
             const userContent: OpenAI.Chat.Completions.ChatCompletionContentPart[] = []

             // Documentos como texto prefixado
