# CONTEXTO: O chat (Story 2.3) e precificação (Story 3.6) estão implementados
# e estáveis. Esta story ADICIONA suporte a anexos de arquivos ao chat,
# mantendo retrocompatibilidade total — mensagens sem anexo continuam usando
# application/json sem nenhuma alteração.
