          |-------------|--------|-------------------------------------------------|
          | 512×512     | low    | 85                                              |
          | 1024×1024   | high   | (2×2×170)+85 = 765                              |
          | 2048×4096   | high   | 1024×2048 → 768×1536 → (2×3×170)+85 = 1105     |
          | 256×256     | auto   | 85 (ambas ≤512 → low)                           |
          | 1920×1080   | auto   | high detail (>512)                               |

