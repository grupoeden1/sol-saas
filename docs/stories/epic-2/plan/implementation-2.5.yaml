#   5. POST /api/chat: dual Content-Type (JSON intocado, multipart com arquivos)
#   6. ChatInput: botão de anexo, preview, envio via FormData
#   7. MessageBubble: exibição de anexos na sessão atual
#   8. runtime = 'nodejs' obrigatório (mammoth, sharp requerem Node.js)
# ─────────────────────────────────────────────────────────────────────────────

