# ─── Risk Assessment ─────────────────────────────────────────────────────────

risks:
  - id: "R1"
    description: "pdf-parse retorna string vazia para PDFs escaneados (imagens sem OCR)"
    severity: MEDIUM
    mitigation: >
      file-processor.ts detecta texto vazio (<10 chars) e retorna 400 com mensagem
      clara orientando o aluno a enviar como imagem ou digitar o conteúdo.
    affectedSubtasks: ["2.2"]

  - id: "R2"
    description: "mammoth e sharp requerem runtime Node.js (não edge)"
    severity: LOW
    mitigation: >
      API Route configurada com `export const runtime = 'nodejs'`.
      Validado que Next.js 14 suporta runtime='nodejs' em API Routes.
    affectedSubtasks: ["3.1"]

  - id: "R3"
    description: "Pico de memória com 3 arquivos × 10MB simultâneos"
    severity: MEDIUM
    mitigation: >
      30MB max por request. Com 200 concorrentes (NFR8), ~6GB pior caso teórico
      — improvável em uso normal. Buffers descartados após montar payload OpenAI.
      Monitorar em produção.
    affectedSubtasks: ["2.2", "3.1"]

  - id: "R4"
    description: "Vision API com GPT-4o tem custo significativamente maior que gpt-4o-mini"
    severity: LOW
    mitigation: >
      Gate calcula com pricing de gpt-4o quando imagem presente. Aluno vê
      custo refletido (via 402 se insuficiente). Custo é transparente.
    affectedSubtasks: ["3.1"]

  - id: "R5"
    description: "sharp pode conflitar com versão do Next.js"
    severity: LOW
    mitigation: >
      Verificar se sharp já é dependência do Next.js antes de instalar.
      Usar versão compatível se necessário.
    affectedSubtasks: ["1.2"]

  - id: "R6"
    description: "FormData.getAll('files') retorna FormDataEntryValue[], não File[]"
    severity: LOW
    mitigation: >
      Cast explícito com validação: filtrar apenas entries que são instanceof File.
      Rejeitar com 400 se algum não for File.
    affectedSubtasks: ["3.1"]

