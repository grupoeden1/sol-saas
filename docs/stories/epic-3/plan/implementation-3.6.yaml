  - id: "phase-2"
    name: "Core Backend Implementation"
    description: >
      Implementar serviço de cotação, contador de tokens, e refatorar funções de créditos.
      Exchange rate e token counter são independentes e podem ser implementados em paralelo.
      Credits functions dependem do schema novo (Phase 1).

    subtasks:

      - id: "2.1"
        description: "Criar serviço de cotação USD-BRL (packages/db/src/exchange-rate.ts)"
        service: backend
        files:
          - "packages/db/src/exchange-rate.ts"
        actions:
          - "Criar arquivo packages/db/src/exchange-rate.ts"
          - "Implementar getExchangeRate(currency: string): Promise<Decimal>"
          - "Implementar updateExchangeRate(currency: string, rate: Decimal): Promise<ExchangeRate>"
          - "Implementar fetchExchangeRateFromApi(currency: string): Promise<Decimal>"
          - "Implementar ensureTodayRate(currency: string): Promise<Decimal> (lazy refresh)"
          - "Criar ExchangeRateApiError custom error class"
        verification:
          type: command
          command: "cd c:/Projetos/Sol/sol-saas && pnpm --filter db exec tsc --noEmit"
        status: pending
        dependencies:
          - "1.3"
        notes: >
          Fluxo do ensureTodayRate (lazy — sem cron):
          1. getExchangeRate("USD-BRL") — busca cotação de hoje no banco
          2. Se encontrou cotação de hoje → retorna (cache hit)
          3. Se não → fetchExchangeRateFromApi("USD-BRL") + updateExchangeRate
          4. Se API falhou → retorna última cotação via getExchangeRate (aceita qualquer data)

          getExchangeRate 3-level fallback:
          1. Cotação de hoje (date = today)
          2. Última cotação disponível (ORDER BY date DESC LIMIT 1)
          3. FALLBACK_USD_BRL_RATE do .env (default "6.00")

          API: GET https://economia.awesomeapi.com.br/json/last/USD-BRL
          Response: { "USDBRL": { "bid": "5.4521", ... } }

          Usar Prisma Decimal (import { Decimal } from '@prisma/client/runtime/library')
          ou import { Decimal } from 'decimal.js' dependendo da versão do Prisma.

      - id: "2.2"
        description: "Criar contador de tokens e calculador de custo (apps/web/src/lib/token-counter.ts)"
        service: backend
        files:
          - "apps/web/src/lib/token-counter.ts"
        actions:
          - "Criar arquivo apps/web/src/lib/token-counter.ts"
          - "Definir constante MODEL_PRICING com preços por modelo"
          - "Implementar countTokens(messages, model): number"
          - "Implementar calculateCostCents(inputTokens, outputTokens, model, exchangeRate): { costUsd, costCents }"
        verification:
          type: command
          command: "cd c:/Projetos/Sol/sol-saas && pnpm --filter web exec tsc --noEmit"
        status: pending
        dependencies:
          - "1.1"
        notes: >
          MODEL_PRICING (preços OpenAI em USD por 1M tokens — atualizar conforme pricing page):
          ```typescript
          const MODEL_PRICING: Record<string, { input: number; output: number }> = {
            'gpt-4o':      { input: 2.50,  output: 10.00 },
            'gpt-4o-mini': { input: 0.15,  output: 0.60  },
          }
          const DEFAULT_PRICING = { input: 2.50, output: 10.00 } // fallback conservador
          ```

          countTokens usa tiktoken:
          ```typescript
          import { encoding_for_model } from 'tiktoken'

          export function countTokens(
            messages: Array<{ role: string; content: string }>,
            model: string
          ): number {
            // encoding_for_model pode lançar para modelos desconhecidos — fallback para cl100k_base
            const enc = encoding_for_model(model as TiktokenModel) ?? get_encoding('cl100k_base')
            let total = 0
            for (const msg of messages) {
              total += 4 // overhead por mensagem (role, name, etc.)
              total += enc.encode(msg.content).length
            }
            total += 2 // assistant reply priming
            enc.free()
            return total
          }
          ```

          calculateCostCents:
          ```typescript
          export function calculateCostCents(
            inputTokens: number,
            outputTokens: number,
            model: string,
            exchangeRate: Decimal
          ): { costUsd: Decimal; costCents: number } {
            const pricing = MODEL_PRICING[model] ?? DEFAULT_PRICING
            const costUsd = new Decimal(inputTokens).mul(pricing.input).div(1_000_000)
              .plus(new Decimal(outputTokens).mul(pricing.output).div(1_000_000))
            const costCents = Math.ceil(costUsd.mul(exchangeRate).mul(100).toNumber())
            return { costUsd, costCents }
          }
          ```

      - id: "2.3"
        description: "Refatorar deductCredits e addCredits em packages/db/src/credits.ts"
        service: backend
        files:
