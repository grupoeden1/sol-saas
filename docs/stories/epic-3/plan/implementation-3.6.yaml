          - "APÓS stream: deductCredits(user.id, realCost.costCents, { exchangeRate, inputTokens, outputTokens, modelUsed: model, costUsd: realCost.costUsd })"
          - "Renomear header X-Credits-Remaining → X-Balance-Remaining"
          - "Renomear evento done: creditsRemaining → balanceRemaining"
          - "Alterar user query: select { balanceCents: true, minBalanceCents: true } (não mais credits)"
        verification:
          type: command
          command: "cd c:/Projetos/Sol/sol-saas && pnpm --filter web exec tsc --noEmit"
        status: pending
        dependencies:
          - "2.2"
          - "2.3"
          - "2.4"
        notes: >
          Fluxo completo refatorado:
          ```
          POST /api/chat
            ├─ auth check
            ├─ buscar user com { balanceCents, minBalanceCents }
            ├─ preparar messages array (system + history + new)
            ├─ countTokens(messages, model) → inputTokens
            ├─ ensureTodayRate("USD-BRL") → exchangeRate
            ├─ calculateCostCents(inputTokens, 0, model, exchangeRate) → estimated
            ├─ user.balanceCents - estimated.costCents < user.minBalanceCents → 402
            ├─ save user message
            ├─ header: X-Balance-Remaining = user.balanceCents (pré-dedução)
            ├─ stream OpenAI
            │   ├─ success:
            │   │   ├─ save assistant message
            │   │   ├─ countTokens([{ role: 'assistant', content: fullResponse }], model) → outputTokens
            │   │   ├─ calculateCostCents(inputTokens, outputTokens, model, exchangeRate) → real
            │   │   ├─ deductCredits(user.id, real.costCents, metadata) → { balanceCents }
            │   │   └─ send { done: true, conversationId, balanceRemaining: balanceCents }
            │   └─ error:
            │       ├─ send { error: message }
            │       └─ NO deduction
          ```

          PRESERVAR: streaming SSE, conversation management, error handling, model selection logic.
          MUDAR: credit check, deduction call, headers, done event payload.

          Para outputTokens: usar countTokens sobre a resposta completa.
          Alternativa: usar stream.usage se disponível (depende do modelo/SDK).
          Preferir countTokens para consistência.

