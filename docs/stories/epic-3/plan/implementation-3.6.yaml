# ─────────────────────────────────────────────────────────────────────────────
# Story 3.6 — Refatoração do Sistema de Precificação
# Implementation Plan v2 (Delta-focused)
# ─────────────────────────────────────────────────────────────────────────────
#
# CONTEXTO: A maior parte do código de precificação já foi implementada
# (Stories 3.1, 3.2, 3.4, 3.5, 3.6v1). Este plano captura apenas o DELTA
# entre o código atual e a spec alvo do PRD v4.0 / Architecture v3.0.
#
# Mudanças-chave:
#   1. Remover conceito minBalanceCents (saldo NUNCA negativo com gate)
#   2. MAX_OUTPUT_TOKENS: 1000 → 8192 (constante exportada, não env var)
#   3. Adicionar maxOutputTokens ao CreditTransaction (auditoria)
#   4. Adicionar estimateMaxCost() e calculateRealCost() como funções nomeadas
#   5. CREDIT_MARGIN_PERCENT → CREDIT_PERCENTAGE (fração decimal 0.40)
#   6. Header X-Balance-Remaining → X-Balance-Cents
#   7. Evento done: balanceRemaining → balanceCents
#   8. Gate simplificado: balanceCents < maxCostCents → 402
#   9. 402 payload expandido: { error, required, available }
# ─────────────────────────────────────────────────────────────────────────────

storyId: "story-3.6"
createdAt: "2026-02-27T18:00:00Z"
createdBy: "@architect"
status: completed
complexity: STANDARD
estimatedEffort: "2-3 days (delta refactoring, not greenfield)"

# ─── Dependencies ────────────────────────────────────────────────────────────

dependencies:
  - name: tiktoken
    version: "^1.0.22"
    purpose: "Contagem precisa de tokens (já instalado em packages/db)"
    install: "N/A — já está em packages/db/package.json"

# ─── Environment Variables ───────────────────────────────────────────────────

envVars:
  - name: FALLBACK_USD_BRL_RATE
    default: "6.00"
    description: "Cotação USD-BRL de fallback quando AwesomeAPI e banco estão indisponíveis"
    status: exists  # já está no .env.example
  - name: CREDIT_PERCENTAGE
    default: "0.40"
    description: "Fração do valor pago via Stripe disponibilizada como saldo interno (0.40 = 40%)"
    status: rename  # renomear de CREDIT_MARGIN_PERCENT

# ─── Constants ────────────────────────────────────────────────────────────────

constants:
  - name: MAX_OUTPUT_TOKENS
    value: 8192
    location: "packages/db/src/token-counter.ts"
    purpose: "Teto de segurança para gate pré-chamada e max_tokens da OpenAI"
    status: change  # atualmente 1000 inline em chat/route.ts, mover para token-counter
  - name: MIN_COST_CENTS
    value: 100
    location: "packages/db/src/token-counter.ts"
    purpose: "Custo mínimo por mensagem = 1 crédito"
    status: export  # existe como const local, precisa ser exportada

# ─── Phases ──────────────────────────────────────────────────────────────────

phases:

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 1 — Setup: Migration + .env.example
  # Schema e configuração. Tudo depende desta fase.
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "phase-1"
    name: "Setup: Migration + .env.example"
    description: >
      Migration Prisma para remover minBalanceCents e adicionar maxOutputTokens.
      Atualização do .env.example para renomear CREDIT_MARGIN_PERCENT → CREDIT_PERCENTAGE.
      Toda refatoração de código depende desta fase.

    subtasks:

      # ─── 1.1: Migration Prisma ────────────────────────────────────────────

      - id: "1.1"
        title: "Migration Prisma — Remover minBalanceCents, adicionar maxOutputTokens"
        service: database
        files:
          - path: "packages/db/prisma/schema.prisma"
            action: MODIFY
          - path: "packages/db/prisma/migrations/YYYYMMDD_remove_min_balance_add_max_tokens/migration.sql"
            action: CREATE
        currentState: |
          - User tem campo `minBalanceCents Int @default(-200)` → NÃO é necessário com gate
          - CreditTransaction NÃO tem campo `maxOutputTokens` → precisa para auditoria
          - Pode existir CHECK constraint `user_balance_above_min` referenciando minBalanceCents
        targetState: |
          - User SEM minBalanceCents (campo removido do schema e da tabela)
          - CreditTransaction COM `maxOutputTokens Int?` (nullable para registros antigos)
          - CHECK constraint antiga removida (se existir)
          - Proteção de saldo garantida pelo UPDATE atômico com WHERE >= 0
        actions:
          - "Em schema.prisma: remover linha `minBalanceCents Int @default(-200)` do model User"
          - "Em schema.prisma: adicionar `maxOutputTokens Int?` ao model CreditTransaction (após costUsd)"
          - "Criar migration: pnpm --filter db exec -- npx prisma migrate dev --create-only --name remove_min_balance_add_max_tokens"
          - "Verificar migration SQL gerada — deve conter DROP COLUMN e ADD COLUMN (não drop+create table)"
          - "Se houver CHECK constraint user_balance_above_min: adicionar DROP CONSTRAINT na migration"
          - "Aplicar migration: pnpm --filter db exec -- npx prisma migrate dev"
          - "Verificar: pnpm --filter db exec -- npx prisma generate"
        verification:
          type: command
          command: "cd c:/Projetos/Sol/sol-saas && pnpm --filter db exec -- npx prisma validate"
        status: completed
        dependencies: []
        notes: |
          Migration SQL esperada:
          ```sql
          -- Remover minBalanceCents
          ALTER TABLE "User" DROP COLUMN "minBalanceCents";

          -- Remover CHECK constraint antiga (se existir)
          ALTER TABLE "User" DROP CONSTRAINT IF EXISTS "user_balance_above_min";

          -- Adicionar maxOutputTokens ao CreditTransaction
          ALTER TABLE "CreditTransaction" ADD COLUMN "maxOutputTokens" INTEGER;
          ```

          IMPORTANTE: Como removemos minBalanceCents, o UPDATE atômico em credits.ts
          passará a usar `>= 0` em vez de `>= minBalanceCents`. Isso será feito na Phase 2.

          Dados existentes: registros antigos terão maxOutputTokens = NULL (nullable).

      # ─── 1.2: .env.example ─────────────────────────────────────────────────

      - id: "1.2"
        title: "Renomear CREDIT_MARGIN_PERCENT → CREDIT_PERCENTAGE no .env.example"
        service: infra
        files:
          - path: ".env.example"
            action: MODIFY
        currentState: |
          Linha 44: CREDIT_MARGIN_PERCENT="40"
          Comentário linha 43: "# Porcentagem do valor pago via Stripe disponibilizada como saldo interno"
        targetState: |
          CREDIT_PERCENTAGE="0.40"
          Comentário: "# Fração do valor pago via Stripe disponibilizada como saldo interno (0.40 = 40%)"
        actions:
          - "Substituir `CREDIT_MARGIN_PERCENT=\"40\"` por `CREDIT_PERCENTAGE=\"0.40\"`"
          - "Atualizar comentário para refletir semântica de fração decimal"
        verification:
          type: manual
          description: "Verificar que .env.example contém CREDIT_PERCENTAGE e não CREDIT_MARGIN_PERCENT"
        status: completed
        dependencies: []
        notes: |
          Mudança semântica: integer percent (40) → decimal fraction (0.40).
          O código do webhook (Phase 3) será atualizado para usar parseFloat.

          LEMBRAR: Atualizar também o .env local do desenvolvedor (não versionado).

  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 2 — Core (packages/db): token-counter + credits
  # Subtasks podem ser executadas em PARALELO (independentes entre si).
  # Todas dependem da Phase 1 (schema atualizado).
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "phase-2"
    name: "Core (packages/db): token-counter + credits"
    description: >
      Adicionar funções estimateMaxCost e calculateRealCost ao token-counter.
      Exportar constantes MAX_OUTPUT_TOKENS e MIN_COST_CENTS.
      Refatorar deductCredits para remover minBalanceCents e adicionar maxOutputTokens.
      exchange-rate.ts NÃO precisa de alterações.

    subtasks:

      # ─── 2.1: Exportar constantes e adicionar funções ao token-counter ────

      - id: "2.1"
        title: "Adicionar MAX_OUTPUT_TOKENS, estimateMaxCost e calculateRealCost"
        service: backend
        files:
          - path: "packages/db/src/token-counter.ts"
            action: MODIFY
        currentState: |
          - MIN_COST_CENTS = 100 é const LOCAL dentro de calculateCostCents (linha 95)
          - MAX_OUTPUT_TOKENS não existe (definido inline como 1000 em chat/route.ts:129)
          - estimateMaxCost() não existe
          - calculateRealCost() não existe
          - calculateCostCents() existe e funciona corretamente (linhas 83-100)
          - MODEL_PRICING e DEFAULT_PRICING exportados (linhas 13-20)
          - countTokens() e countRawTokens() existem e funcionam
        targetState: |
          - MAX_OUTPUT_TOKENS = 8192 exportado como constante de módulo
          - MIN_COST_CENTS = 100 exportado como constante de módulo
          - estimateMaxCost(inputTokens, model, exchangeRate) → number (maxCostCents)
          - calculateRealCost(inputTokens, outputTokens, model, exchangeRate) → { costCents, costUsd }
          - calculateCostCents mantido como implementação interna (usado por ambas)
        actions:
          - "Mover MIN_COST_CENTS para nível de módulo e exportar"
          - "Adicionar e exportar `export const MAX_OUTPUT_TOKENS = 8192`"
          - "Adicionar função exportada `estimateMaxCost`"
          - "Adicionar função exportada `calculateRealCost` (wrapper de calculateCostCents)"
          - "Atualizar calculateCostCents para usar MIN_COST_CENTS do nível de módulo"
        verification:
          type: command
          command: "cd c:/Projetos/Sol/sol-saas && pnpm --filter db exec tsc --noEmit"
        status: completed
        dependencies:
          - "1.1"
        notes: |
          Código a adicionar (após as constantes MODEL_PRICING):

          ```typescript
          // ─── Constants ─────────────────────────────────────────────────────────
          export const MAX_OUTPUT_TOKENS = 8192   // teto para gate e max_tokens OpenAI
          export const MIN_COST_CENTS = 100       // 1 crédito = custo mínimo por mensagem

          // ─── estimateMaxCost ───────────────────────────────────────────────────
          /**
           * Estima custo MÁXIMO possível (input real + MAX_OUTPUT_TOKENS de output).
           * Usado como gate pré-chamada: se saldo < maxCost → 402.
           */
          export function estimateMaxCost(
            inputTokens: number,
            model: string,
            exchangeRate: Prisma.Decimal,
          ): number {
            const { costCents } = calculateCostCents(
              inputTokens,
              MAX_OUTPUT_TOKENS,
              model,
              exchangeRate,
            )
            return costCents
          }

          // ─── calculateRealCost ─────────────────────────────────────────────────
          /**
           * Calcula custo REAL após streaming (input + output reais).
           * Sempre >= MIN_COST_CENTS.
           */
          export function calculateRealCost(
            inputTokens: number,
            outputTokens: number,
            model: string,
            exchangeRate: Prisma.Decimal,
          ): { costCents: number; costUsd: Prisma.Decimal } {
            return calculateCostCents(inputTokens, outputTokens, model, exchangeRate)
          }
          ```

          calculateRealCost é um alias semântico de calculateCostCents.
          Ambas podem coexistir — calculateCostCents é o workhorse, calculateRealCost
          torna a intenção explícita na API route.

          Nota: exchange-rate.ts NÃO precisa de alterações (já funcional).

      # ─── 2.2: Refatorar deductCredits ─────────────────────────────────────

      - id: "2.2"
        title: "Refatorar deductCredits: remover minBalanceCents, adicionar maxOutputTokens"
        service: backend
        files:
          - path: "packages/db/src/credits.ts"
            action: MODIFY
        currentState: |
          - DeductMetadata: { exchangeRate, inputTokens, outputTokens, modelUsed, costUsd, conversationTitle }
            → FALTA maxOutputTokens
          - InsufficientBalanceError constructor: (userId, current, required, min)
            → parâmetro `min` referencia minBalanceCents
          - deductCredits WHERE: `"balanceCents" - ${costCents} >= "minBalanceCents"` (linha 96)
          - user query selects: { balanceCents, minBalanceCents } (linha 104)
          - Erro referencia minBalanceCents na mensagem (linha 20)
        targetState: |
          - DeductMetadata: adicionar `maxOutputTokens: number`
          - InsufficientBalanceError: remover parâmetro `min` (saldo nunca negativo)
          - deductCredits WHERE: `"balanceCents" - ${costCents} >= 0` (sem minBalanceCents)
          - user query selects: { balanceCents } apenas
          - CreditTransaction.create: incluir maxOutputTokens
          - Erro simplificado: "Saldo insuficiente: usuário X tem Y centavos, necessário Z"
        actions:
          - "Adicionar `maxOutputTokens: number` à interface DeductMetadata"
          - "Simplificar InsufficientBalanceError: remover parâmetro `min`, atualizar mensagem"
          - "Alterar WHERE do UPDATE atômico: >= 'minBalanceCents' → >= 0"
          - "Remover minBalanceCents do select do user query no catch"
          - "Adicionar maxOutputTokens: metadata.maxOutputTokens ao CreditTransaction.create"
        verification:
          type: command
          command: "cd c:/Projetos/Sol/sol-saas && pnpm --filter db exec tsc --noEmit"
        status: completed
        dependencies:
          - "1.1"
        notes: |
          DELTA detalhado por bloco de código:

          1. DeductMetadata (linha 6-13):
             ANTES: sem maxOutputTokens
             DEPOIS: adicionar `maxOutputTokens: number` após conversationTitle

          2. InsufficientBalanceError (linhas 17-24):
             ANTES: constructor(userId, current, required, min)
                    msg: `...tem ${current} centavos, necessário ${required}, limite mínimo ${min}`
             DEPOIS: constructor(userId, current, required)
                     msg: `...tem ${current} centavos, necessário ${required}`

          3. UPDATE atômico (linha 96):
             ANTES: AND "balanceCents" - ${costCents} >= "minBalanceCents"
             DEPOIS: AND "balanceCents" - ${costCents} >= 0

          4. User query no catch (linhas 102-105):
             ANTES: select: { balanceCents: true, minBalanceCents: true }
             DEPOIS: select: { balanceCents: true }

          5. throw InsufficientBalanceError (linhas 107-112):
             ANTES: (userId, user?.balanceCents ?? 0, costCents, user?.minBalanceCents ?? -200)
             DEPOIS: (userId, user?.balanceCents ?? 0, costCents)

          6. CreditTransaction.create (linhas 115-127):
             ANTES: sem maxOutputTokens
             DEPOIS: adicionar `maxOutputTokens: metadata.maxOutputTokens,`

      # ─── 2.3: Nota sobre exchange-rate.ts ──────────────────────────────────

      # exchange-rate.ts NÃO precisa de alterações.
      # Funções getExchangeRate, ensureTodayRate, updateExchangeRate, fetchExchangeRateFromApi
