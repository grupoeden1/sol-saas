status: pending
complexity: STANDARD
estimatedEffort: "3-5 days"

# ─── Dependencies ────────────────────────────────────────────────────────────

dependencies:
  - name: tiktoken
    version: "latest"
    purpose: "Contagem precisa de tokens para cálculo de custo por mensagem (OpenAI-compatible tokenizer)"
    install: "pnpm --filter web add tiktoken"

# ─── Environment Variables ───────────────────────────────────────────────────

envVars:
  - name: FALLBACK_USD_BRL_RATE
    default: "6.00"
    description: "Cotação USD-BRL de fallback quando AwesomeAPI e banco estão indisponíveis"
  - name: CREDIT_MARGIN_PERCENT
    default: "40"
    description: "Porcentagem do valor pago via Stripe disponibilizada como saldo interno"

# ─── Phases ──────────────────────────────────────────────────────────────────

