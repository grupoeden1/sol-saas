  # PHASE 1 — Setup & Database Migration
  # Tudo depende do schema novo. Executar primeiro e validar.
  # ═══════════════════════════════════════════════════════════════════════════

  - id: "phase-1"
    name: "Setup & Database Migration"
    description: >
      Instalar nova dependência (tiktoken), atualizar schema Prisma com todos os novos
      campos/modelos, gerar e aplicar migration, e atualizar variáveis de ambiente.
      Tudo o mais depende desta fase.

    subtasks:

      - id: "1.1"
        description: "Instalar tiktoken como dependência de apps/web"
        service: infra
        files:
          - "apps/web/package.json"
        actions:
          - "pnpm --filter web add tiktoken"
        verification:
          type: command
          command: "pnpm --filter web exec -- node -e \"require('tiktoken')\""
        status: pending
        dependencies: []
        notes: >
          tiktoken é a biblioteca oficial da OpenAI para contagem de tokens.
          Instalar em apps/web (não em packages/db) pois a contagem acontece na API route.

      - id: "1.2"
        description: "Atualizar schema Prisma com novos modelos e campos"
        service: database
        files:
          - "packages/db/prisma/schema.prisma"
        actions:
          - "Criar model ExchangeRate { id, currency, rate (Decimal), date (@db.Date), createdAt, @@unique([currency, date]) }"
          - "Renomear User.credits → User.balanceCents (Int, default 0)"
          - "Adicionar User.minBalanceCents (Int, default -200)"
          - "Adicionar em CreditTransaction: exchangeRate (Decimal?), inputTokens (Int?), outputTokens (Int?), modelUsed (String?), costUsd (Decimal?)"
          - "Alterar CreditTransaction.description de String → String? (nullable para retrocompatibilidade)"
        verification:
          type: command
          command: "cd c:/Projetos/Sol/sol-saas && pnpm --filter db exec -- npx prisma validate"
        status: pending
        dependencies: []
        notes: >
          IMPORTANTE: O rename de credits → balanceCents no Prisma deve usar @map("credits")
          OU ser feito via migration SQL com ALTER TABLE ... RENAME COLUMN para preservar dados.
          Prisma interpreta rename como drop+create — usar migration customizada.

          Schema target (mudanças):
          ```
          model User {
            balanceCents    Int  @default(0)     // was: credits
            minBalanceCents Int  @default(-200)  // NEW
          }
          model CreditTransaction {
            description     String?              // was: String (not nullable)
            exchangeRate    Decimal?             // NEW
            inputTokens     Int?                 // NEW
            outputTokens    Int?                 // NEW
            modelUsed       String?              // NEW
            costUsd         Decimal?             // NEW
          }
          model ExchangeRate {
            id        String   @id @default(cuid())
            currency  String
            rate      Decimal
            date      DateTime @db.Date
            createdAt DateTime @default(now())
            @@unique([currency, date])
          }
          ```

      - id: "1.3"
        description: "Criar migration SQL customizada com rename seguro e CHECK constraint"
        service: database
        files:
          - "packages/db/prisma/migrations/YYYYMMDD_pricing_refactoring/migration.sql"
        actions:
          - "pnpm --filter db exec -- npx prisma migrate dev --create-only --name pricing_refactoring"
          - "Editar migration.sql gerada para usar RENAME COLUMN (não drop+create)"
          - "Adicionar DROP CONSTRAINT user_credits_non_negative (se existir)"
          - "Adicionar CHECK constraint: ALTER TABLE \"User\" ADD CONSTRAINT \"user_balance_above_min\" CHECK (\"balanceCents\" >= \"minBalanceCents\")"
          - "Aplicar migration: pnpm --filter db exec -- npx prisma migrate dev"
        verification:
          type: command
          command: "cd c:/Projetos/Sol/sol-saas && pnpm --filter db exec -- npx prisma migrate status"
        status: pending
        dependencies:
          - "1.2"
        notes: >
          Migration SQL esperada (pseudocódigo):
          ```sql
          -- Rename credits → balanceCents
          ALTER TABLE "User" RENAME COLUMN "credits" TO "balanceCents";

          -- Add minBalanceCents
          ALTER TABLE "User" ADD COLUMN "minBalanceCents" INTEGER NOT NULL DEFAULT -200;

          -- Add new CreditTransaction fields
          ALTER TABLE "CreditTransaction" ADD COLUMN "exchangeRate" DECIMAL;
          ALTER TABLE "CreditTransaction" ADD COLUMN "inputTokens" INTEGER;
          ALTER TABLE "CreditTransaction" ADD COLUMN "outputTokens" INTEGER;
          ALTER TABLE "CreditTransaction" ADD COLUMN "modelUsed" TEXT;
          ALTER TABLE "CreditTransaction" ADD COLUMN "costUsd" DECIMAL;
          ALTER TABLE "CreditTransaction" ALTER COLUMN "description" DROP NOT NULL;

          -- Create ExchangeRate table
          CREATE TABLE "ExchangeRate" (
            "id" TEXT NOT NULL,
            "currency" TEXT NOT NULL,
            "rate" DECIMAL NOT NULL,
            "date" DATE NOT NULL,
            "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            CONSTRAINT "ExchangeRate_pkey" PRIMARY KEY ("id")
          );
          CREATE UNIQUE INDEX "ExchangeRate_currency_date_key" ON "ExchangeRate"("currency", "date");

          -- Drop old constraint (Story 3.1)
          ALTER TABLE "User" DROP CONSTRAINT IF EXISTS "user_credits_non_negative";

          -- Add new constraint
          ALTER TABLE "User" ADD CONSTRAINT "user_balance_above_min"
            CHECK ("balanceCents" >= "minBalanceCents");
          ```

      - id: "1.4"
        description: "Atualizar .env.example com novas variáveis de ambiente"
