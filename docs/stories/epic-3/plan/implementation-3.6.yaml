          function formatBalance(balanceCents: number): string {
            // Mapear para "créditos" — aluno nunca vê centavos/reais
            // Ex: 2796 centavos → "27,96 créditos" ou simplificado para "28 créditos"
            const credits = Math.floor(balanceCents / 100)
            if (credits <= 0) return '0 créditos'
            return `${credits} crédito${credits !== 1 ? 's' : ''}`
          }
          ```

