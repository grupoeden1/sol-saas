          - "Atualizar mensagem do erro para incluir minBalanceCents"
          - "Refatorar deductCredits: nova assinatura com costCents + metadata (exchangeRate, inputTokens, outputTokens, modelUsed, costUsd)"
          - "Refatorar validação: balanceCents - costCents >= minBalanceCents"
          - "Refatorar addCredits: nova assinatura com amountCents, stripePaymentId obrigatório, exchangeRate opcional"
          - "Ambas funções operam em balanceCents (não mais credits)"
          - "Retornar { balanceCents: number } em vez de number"
        verification:
          type: command
          command: "cd c:/Projetos/Sol/sol-saas && pnpm --filter db exec tsc --noEmit"
        status: pending
        dependencies:
          - "1.3"
        notes: >
          Refatoração incremental — preservar a estrutura existente, mudar assinaturas e lógica interna.

          ANTES (current):
            deductCredits(userId: string, amount: number): Promise<number>
            addCredits(userId: string, amount: number, stripePaymentId?: string): Promise<number>

          DEPOIS (target):
            deductCredits(userId: string, costCents: number, metadata: DeductMetadata): Promise<{ balanceCents: number }>
            addCredits(userId: string, amountCents: number, stripePaymentId: string, exchangeRate?: Decimal): Promise<{ balanceCents: number }>

          DeductMetadata type:
          ```typescript
          interface DeductMetadata {
            exchangeRate: Decimal;
            inputTokens: number;
            outputTokens: number;
            modelUsed: string;
            costUsd: Decimal;
          }
          ```

          Validação de saldo:
            ANTES: user.credits < amount → InsufficientCreditsError
            DEPOIS: user.balanceCents - costCents < user.minBalanceCents → InsufficientBalanceError

          CreditTransaction.create:
            ANTES: { amount: -amount, type: 'consumption', description }
            DEPOIS: { amount: -costCents, type: 'consumption', description, exchangeRate, inputTokens, outputTokens, modelUsed, costUsd }

      - id: "2.4"
        description: "Atualizar exports de packages/db/src/index.ts"
        service: backend
        files:
