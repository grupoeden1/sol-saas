    - agent: "@architect"
      phases: ["phase-2-architecture"]
      role: "Define API Gateway pattern, service layer, cache strategy, índices"
    - agent: "@sm"
      phases: ["phase-3-stories"]
      role: "Cria 9 story files com tasks, dev notes e DoD"
    - agent: "@dev"
      phases:
        [
          "phase-4-schema-and-core",
          "phase-5-api-integrations",
          "phase-6-quiz-integration",
          "phase-7-admin-and-extras",
