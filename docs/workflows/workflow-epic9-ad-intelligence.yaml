  # ===========================================================================
  # PHASE 4 — IMPLEMENTATION: Schema + Core Services
  # ===========================================================================
  - id: phase-4-schema-and-core
    name: "Implementação — Schema e Services Core"
    description: "Migrar schema, implementar API Gateway e services base"
    agent: "@dev"
    dependsOn: ["phase-3-stories"]

    steps:
      - id: "4.1"
        action: "implement-schema"
        description: "Story 9.1 — Schema: migrations, seeds e relações"
        prompt: |
          @dev — Implementar Story 9.1 (Database Schema: References &
          Integrations).

          Adicionar ao schema.prisma:

          1. Enum `ReferenceSource`:
             META_AD_LIBRARY, TIKTOK, YOUTUBE, INSTAGRAM,
             MANUAL_UPLOAD, ENRICHMENT

          2. Tabela `creative_references` com todos os campos do AC1.
             Atenção: `engagement_metrics` é Json (tipo Prisma),
             `format_classification` e `format_corrected` são String?.

          3. Tabela `search_cache` com TTL via `expires_at`.
             `query_hash` é String @unique.
             `results` é Json.

          4. Tabela `api_configurations` com `provider` @unique.
             `config` é Json?.
             Seeds: meta (enabled), youtube (enabled),
             tiktok (enabled=false — aguardando aprovação),
             instagram (enabled).

          5. Tabela `competitor_profiles` com `top_posts` Json?.

          6. Relações:
             - User.creativeReferences → CreativeReference[]
             - QuizSession.creativeReferences → CreativeReference[]
             - User.competitorProfiles → CompetitorProfile[]

          7. Índices:
             - creative_references: @@index([source, searchQuery]),
               @@index([userId, createdAt]), @@index([quizSessionId])
             - search_cache: @@index([expiresAt])
             - competitor_profiles: @@index([userId, platform])

          Rodar `prisma migrate dev --name add-ad-intelligence-schema`.
          Rodar `prisma generate` e verificar tipos.

        files:
          - "packages/db/prisma/schema.prisma"
        verification:
          type: command
          command: "cd packages/db && npx prisma migrate dev --name add-ad-intelligence-schema && npx prisma generate"

      - id: "4.2"
        action: "implement-api-gateway"
        description: "Implementar API Gateway com cache, retry e fallback"
        prompt: |
          @dev — Implementar API Gateway genérico para todas as integrações
          externas do Epic 9.

          Criar `apps/web/lib/services/api-gateway.ts`:

          ```typescript
          interface GatewayConfig {
            provider: string
            baseUrl: string
            rateLimit: { maxPerHour: number }
            cacheTtlMs: number
            timeoutMs: number
            retries: number
          }

          interface GatewayResult<T> {
            data: T
            source: 'api' | 'cache' | 'stale_cache'
            cached: boolean
          }
          ```

          Funcionalidades:
          - Rate limiter em memória (Map<provider, {count, resetAt}>)
          - Cache via tabela `search_cache` (Prisma)
          - Retry com exponential backoff (max 3 tentativas)
          - Fallback chain: API → cache fresh → cache stale → null
          - Timeout configurável por provider
          - Logging de cada chamada: provider, latency, source, error

          Helper `getCacheKey(query, source, filters)`:
          - Gera hash determinístico (SHA-256) dos parâmetros
          - Usado como `query_hash` na tabela `search_cache`

          Helper `cleanExpiredCache()`:
          - Deleta registros com `expires_at < NOW()`
          - Chamado periodicamente (não blocking)

          NUNCA armazenar chaves de API no gateway ou no banco.
          Chaves lidas de `process.env[config.apiKeyEnv]`.

          TypeScript strict. Sem any.

        files:
          - "apps/web/lib/services/api-gateway.ts"
        verification:
          type: command
          command: "npm run typecheck"

      - id: "4.3"
        action: "implement-format-classifier"
        description: "Story 9.5 — Classificação automática de formato via Vision"
        prompt: |
          @dev — Implementar Story 9.5 (Classificação Automática de Formato).

          Criar `apps/web/lib/services/format-classifier.ts`:

          1. Enum `CreativeFormat` com 18 valores:
             TOP_5, BEFORE_AFTER, THIS_OR_THAT, TESTIMONIAL, TUTORIAL,
             INFORMATIVE, LOW_FI, PROVOCATION, QUESTION, RANKING,
             CURIOSITY, TRANSFORMATION, BEHIND_SCENES, UNBOXING, POV,
             STORYTELLING, CHALLENGE, OTHER

          2. Função `classifyFormat(input: { imageUrl?: string,
             imageBuffer?: Buffer, adCopy?: string })`:
             - Envia para Claude Vision (`claude-haiku-4-5-20251001`)
             - Prompt estruturado que descreve cada formato com exemplos
             - Retorna: `{ format: CreativeFormat, confidence:
               'HIGH'|'MEDIUM'|'LOW', reasoning: string }`

          3. Cache de classificação:
             - Se `source_url` já classificada em `creative_references`,
               reutiliza sem nova chamada
             - Reduz custo de créditos significativamente

          4. Batch classification: função `classifyBatch(refs[], limit=5)`:
             - Classifica apenas os primeiros `limit` resultados
             - Demais ficam como `null` — classificados sob demanda

          5. Custo em créditos: usar mesma lógica de gate do FR5.
             Tokens da imagem incluídos no cálculo.
             Haiku é barato: ~0.5-1 crédito por classificação.

          6. Prompt de classificação deve ser preciso para o contexto
             brasileiro de infoprodutos. Incluir exemplos específicos:
             - TOP_5: "5 alimentos que queimam gordura"
             - BEFORE_AFTER: "Antes e depois da dieta da selva"
             - THIS_OR_THAT: "Pilates vs Academia: qual emagrece mais?"
             - etc.

          TypeScript strict. Sem any.

        files:
          - "apps/web/lib/services/format-classifier.ts"
        verification:
          type: command
          command: "npm run typecheck"

