# =============================================================================
# WORKFLOW: Epic 9 — Ad Intelligence & Content Discovery
# =============================================================================
# Plataforma de descoberta e análise de referências criativas integrada ao quiz.
# Busca de ads (Meta Ad Library API) e conteúdos orgânicos virais (TikTok
# Research API, YouTube Data API v3, Instagram Graph API) com classificação
# automática de formato via Claude Vision e geração de roteiro modelado.
#
# 3 Fases de Entrega:
#   Fase 1: Meta Ad Library API (ads) + Análise de Link Social
#   Fase 2: Busca de Virais Orgânicos (TikTok, YouTube, Instagram)
#   Fase 3: Enrichment Layer (terceiros) + Análise de Concorrentes
#
# Princípio: APIs oficiais como alicerce. Terceiros como enrichment opcional
# com fallback silencioso. Upload manual sempre disponível como camada 3.
# =============================================================================

id: workflow-epic9-ad-intelligence
name: "Epic 9 — Ad Intelligence & Content Discovery"
version: "1.0"
createdAt: "2026-03-11"
createdBy: "Eden Corporate"
trigger: manual
status: draft

metadata:
  project: SOL
  epic: 9
  description: >
    Plataforma de descoberta e análise de referências criativas. O aluno
    informa o nicho no quiz, o SOL busca referências de ads e conteúdos
    orgânicos virais via APIs oficiais, a IA classifica formato e estrutura,
    e gera roteiro modelado. Diferencial: ciclo completo (descobrir → analisar
    → gerar) em um único produto. Nenhuma ferramenta no mercado brasileiro
    faz isso integrado para infoprodutos.
  dependencies:
    - epic: 6
      reason: "Quiz engine e caminhos condicionais (1A/1B + 2A/2B) — a busca de referências se integra ao quiz"
    - epic: 7
      reason: "Pipeline de processamento de vídeo (AssemblyAI + FFmpeg + Vision) — reutilizado para análise de referências"
    - story: "4.1"
      reason: "Role-based access control para configurações admin das APIs"
  risks:
    - id: "R1"
      description: "Meta Ad Library API tem rate limits e pode mudar sem aviso"
      mitigation: "Cache de resultados por 24h, retry com backoff, fallback para upload manual"
    - id: "R2"
      description: "TikTok Research API requer aprovação que pode demorar 2-4 semanas"
      mitigation: "Fase 2 inicia com YouTube Data API (acesso imediato) enquanto aguarda aprovação TikTok"
    - id: "R3"
      description: "APIs de terceiros (enrichment) podem sair do ar"
      mitigation: "Arquitetura de fallback silencioso — se terceiro cai, experiência funciona sem ele"
    - id: "R4"
      description: "Classificação automática de formato imprecisa"
      mitigation: "Aluno pode corrigir formato manualmente após classificação da IA"
  apiOverview:
    official:
      - name: "Meta Ad Library API"
        purpose: "Busca de anúncios ativos por termo/página"
        auth: "Meta Developer App + Access Token"
        cost: "Gratuita"
        rateLimit: "200 calls/hora"
        docs: "https://www.facebook.com/ads/library/api/"
        dataReturned: "ad copy, preview link, start date, platforms, status, advertiser info"
        dataNotAvailable: "CTR, ROAS, CPC, impressões, gasto, segmentação"
      - name: "YouTube Data API v3"
        purpose: "Busca de vídeos orgânicos virais por keyword"
        auth: "Google Cloud API Key"
        cost: "Gratuita (10.000 units/dia)"
        rateLimit: "10.000 quota units/dia"
        docs: "https://developers.google.com/youtube/v3"
        dataReturned: "views, likes, comments, duration, thumbnail, publishedAt"
      - name: "TikTok Research API"
        purpose: "Busca de vídeos virais por keyword/hashtag"
        auth: "Aplicação aprovada pelo TikTok"
        cost: "Gratuita para pesquisa"
        rateLimit: "1000 requests/dia"
        docs: "https://developers.tiktok.com/products/research-api/"
        dataReturned: "views, likes, shares, comments, duration, music"
      - name: "Instagram Graph API"
        purpose: "Busca de posts por hashtag"
        auth: "Meta Developer App + Instagram Business Account"
        cost: "Gratuita"
        rateLimit: "200 calls/hora, hashtag search limitado a 30 resultados"
        docs: "https://developers.facebook.com/docs/instagram-api/"
        dataReturned: "likes, comments, permalink, media URL, timestamp"
    enrichment:
      - name: "API de terceiros (AdSpy/BigSpy/Apify)"
        purpose: "Banco histórico de ads e orgânicos"
        cost: "$99-149/mês fixo"
        risk: "Pode sair do ar a qualquer momento"
        architecture: "Enrichment layer opcional com fallback silencioso"

# =============================================================================
# PHASES
# =============================================================================

phases:
  # ===========================================================================
  # PHASE 1 — PRD: EPIC 9 COMPLETO
  # ===========================================================================
  - id: phase-1-prd
    name: "PRD — Epic 9 Ad Intelligence"
    description: "Definir Epic 9 completo no PRD com FRs, stories e ACs"
    agent: "@pm"

    steps:
      - id: "1.1"
        action: "create-epic-9-prd"
        description: "Adicionar Epic 9 ao PRD com todas as stories"
        prompt: |
          @pm — Atualizar PRD para adicionar Epic 9 — Ad Intelligence &
          Content Discovery. Este é o epic que transforma o SOL de "gerador
          de roteiros" para "plataforma de inteligência criativa".

          ## Contexto de Produto

          O aluno do Space hoje faz manualmente: abre AdSpy ($149/mês) para
          buscar referências de ads, abre TikTok/Instagram para buscar
          conteúdos orgânicos virais, analisa na cabeça o formato e estrutura,
          e depois tenta escrever o roteiro. São 4 ferramentas e 3+ horas.
          O SOL vai fazer tudo em um fluxo dentro do quiz.

          ## Functional Requirements (adicionar)

          - **FR35:** O sistema deve buscar anúncios ativos na Meta Ad Library
            API por termo de busca (nicho/produto) e país (Brasil), retornando:
            ad copy, link de preview do criativo, data de início, plataformas,
            nome do anunciante. Resultados ordenados por longevidade (dias
            ativo = proxy de performance). Cache de 24h por busca.

          - **FR36:** O sistema deve buscar conteúdos orgânicos virais por
            keyword/hashtag via: YouTube Data API v3 (vídeos), TikTok Research
            API (vídeos), Instagram Graph API (posts/reels). Resultados
            ordenados por engajamento (views, likes, shares). Cache de 12h.

          - **FR37:** O sistema deve analisar qualquer link de post social
            (TikTok, Instagram, YouTube, Facebook) colado pelo aluno:
            extrair metadados via API oficial da plataforma, baixar/acessar
            mídia quando disponível, classificar formato automaticamente via
            Claude Vision.

          - **FR38:** O sistema deve classificar automaticamente o formato
            do criativo via Claude Vision: top 5, antes/depois, isso ou aquilo,
            testemunho, tutorial, informativo, low-fi, provocação, pergunta,
            classificação/ranking, curiosidade, transformação, bastidores,
            unboxing, POV. Aluno pode corrigir manualmente.

          - **FR39:** A busca de referências deve se integrar aos caminhos
            do quiz: no Caminho 1A (Anúncio), busca via Meta Ad Library API;
            no Caminho 1B (Orgânico), busca via TikTok/YouTube/Instagram APIs.
            O aluno pode selecionar referência da busca OU fazer upload manual
            (Caminho 2A existente). A referência selecionada alimenta o prompt
            de geração do roteiro.

          - **FR40:** Enrichment layer opcional via API de terceiros
            (configurável pelo admin). Se disponível, enriquece resultados
            com badge "Histórico". Se indisponível, experiência funciona
            normalmente sem erro visível. Admin configura/desativa via
            `/admin/integrations`.

          - **FR41:** O sistema deve analisar perfis de concorrentes: aluno
            informa @ ou URL do perfil, sistema lista últimos posts via API
            oficial, ordena por engajamento, mostra quais conteúdos performaram
            melhor. Disponível como feature complementar fora do quiz.

          ## Epic 9: Ad Intelligence & Content Discovery

          > Plataforma de descoberta e análise de referências criativas
          > integrada ao quiz. Três fases: (1) Meta Ad Library + análise
          > de link, (2) busca de virais orgânicos, (3) enrichment +
          > concorrentes. Ao final, o aluno descobre, analisa e gera
          > roteiro em um único fluxo.

          ### Story 9.1 — Database Schema: References & Integrations

          As a developer,
          I want the database schema for creative references, API
          configurations and search cache,
          so that reference data can be stored and used for script generation.

          **Acceptance Criteria:**

          1. Migration Prisma cria tabela `creative_references` com: `id`,
             `user_id` (FK), `quiz_session_id` (FK, nullable), `source`
             (enum: `META_AD_LIBRARY` | `TIKTOK` | `YOUTUBE` | `INSTAGRAM`
             | `MANUAL_UPLOAD` | `ENRICHMENT`), `source_url` (string, nullable),
             `source_id` (string, nullable — ID externo da plataforma),
             `media_type` (enum: `VIDEO` | `IMAGE`), `media_url` (string,
             nullable — URL do preview/mídia), `ad_copy` (text, nullable),
             `start_date` (datetime, nullable — data início do ad),
             `days_active` (int, nullable — calculado), `engagement_metrics`
             (JSON, nullable — views, likes, shares, comments), `platform`
             (string — facebook, instagram, tiktok, youtube),
             `format_classification` (string, nullable — classificado pela IA),
             `format_corrected` (string, nullable — corrigido pelo aluno),
             `structure_analysis` (text, nullable — análise IA de gancho,
             CTA, cortes), `advertiser_name` (string, nullable),
             `search_query` (string — termo usado na busca), `created_at`

          2. Migration cria tabela `search_cache` com: `id`, `query_hash`
             (string, unique — hash de query+source+country), `source`
             (enum), `results` (JSON — resultados serializados),
             `expires_at` (datetime), `created_at`.
             TTL: 24h para ads, 12h para orgânico.

          3. Migration cria tabela `api_configurations` com: `id`, `provider`
             (string, unique — meta, tiktok, youtube, instagram, enrichment),
             `enabled` (boolean, default true), `api_key_env` (string —
             nome da env var, nunca a chave em si), `rate_limit_per_hour`
             (int), `config` (JSON, nullable — configurações extras),
             `updated_at`, `updated_by` (string). Seeds iniciais para
             as 4 APIs oficiais.

          4. Migration cria tabela `competitor_profiles` com: `id`,
             `user_id` (FK), `platform` (string), `profile_handle`
             (string), `profile_url` (string), `last_fetched_at`
             (datetime, nullable), `top_posts` (JSON, nullable),
             `created_at`

          5. Relações: `user.creativeReferences`,
             `quizSession.creativeReferences`, `user.competitorProfiles`

          6. Índices: `(source, search_query)`, `(user_id, created_at)`,
             `(quiz_session_id)`, `(query_hash)` na search_cache

          ### Story 9.2 — Meta Ad Library API Integration

          As a student doing the Ad Creative path (1A),
          I want to search active ads in my niche directly from the quiz,
          so that I can find proven ad references without leaving SOL.

          **Acceptance Criteria:**

          1. Service `AdLibraryService` em `apps/web/lib/services/ad-library.ts`
             encapsula toda comunicação com Meta Ad Library API.
             Configuração via `META_AD_LIBRARY_ACCESS_TOKEN` (env var)

          2. `GET /api/references/ads?q={query}&country=BR&limit=20`
             busca anúncios ativos na Meta Ad Library API. Parâmetros
             mapeados: `search_terms`, `ad_reached_countries=BR`,
             `ad_active_status=ACTIVE`, `media_type=ALL`

          3. Resultados retornam: `ad_copy` (body text do anúncio),
             `preview_url` (link do preview do criativo),
             `ad_delivery_start_time` (data início),
             `days_active` (calculado: hoje - start_time),
             `publisher_platforms` (facebook, instagram, etc),
             `page_name` (nome do anunciante)

          4. Resultados ordenados por `days_active DESC` — anúncios mais
             antigos primeiro (proxy de performance: mais tempo ativo =
             provavelmente lucrativo)

          5. Cache implementado via tabela `search_cache`: se existe cache
             válido (< 24h) para mesma query+source, retorna cache.
             Senão, busca na API e salva cache.

          6. Rate limiting respeitado: máximo 200 calls/hora. Se exceder,
             retorna cache stale com aviso ou mensagem amigável.

          7. Erro da API (timeout, rate limit, indisponível) retorna
             fallback gracioso: mensagem "Busca temporariamente
             indisponível. Faça upload manual da referência."
             Nunca erro técnico visível ao aluno.

          8. Integração no quiz: no Caminho 1A, após pergunta Q4 (nicho),
             seção "Referências Encontradas" aparece com resultados da
             busca. Aluno pode selecionar referência OU ignorar e seguir
             com upload manual (2A) ou sem referência (2B).

          9. Quando aluno seleciona referência, `creative_references`
             registrada com todos os metadados. Referência vinculada
             ao `quiz_session_id`.

          10. Preview do criativo exibido inline (imagem) ou como
              thumbnail com link (vídeo). Sem download automático
              de vídeos — aluno faz upload manual se quiser análise
              profunda via pipeline do Epic 7.

          ### Story 9.3 — Link Analysis: Cole Qualquer Link Social

          As a student,
          I want to paste any social media post link and have the AI
          analyze it automatically,
          so that I can use any reference I find online.

          **Acceptance Criteria:**

          1. `POST /api/references/analyze-link` aceita URL de post
             social. Detecta plataforma automaticamente via regex:
             - `tiktok.com` → TikTok
             - `instagram.com/p/` ou `/reel/` → Instagram
             - `youtube.com/watch` ou `youtu.be` ou `/shorts/` → YouTube
             - `facebook.com` → Facebook

          2. Para cada plataforma, usa API oficial para extrair metadados:
             - YouTube: Data API v3 → title, views, likes, duration,
               thumbnail, publishedAt
             - Instagram: oEmbed endpoint (público, sem auth) → thumbnail,
               title, author. Graph API se disponível → likes, comments
             - TikTok: oEmbed endpoint → title, author, thumbnail.
               Research API se aprovada → views, likes, shares
             - Facebook: oEmbed endpoint → title, author, thumbnail

          3. Se mídia é imagem: exibe inline + envia para Claude Vision
             para classificação automática de formato

          4. Se mídia é vídeo: exibe thumbnail + metadados. Aluno pode
             optar por "Analisar vídeo completo" que abre upload manual
             para pipeline do Epic 7 (AssemblyAI + FFmpeg + Vision)

          5. Classificação de formato via Claude Vision (`claude-haiku-4-5-20251001`
             para economia): analisa thumbnail/imagem e retorna formato
             classificado (top 5, testemunho, tutorial, etc) com confiança
             (alta/média/baixa). Se confiança baixa, sugere ao aluno
             confirmar/corrigir.

          6. Custo da classificação em créditos: deduzido do saldo do aluno
             (mesma lógica FR5). Gate pré-chamada inclui tokens da imagem.

          7. Resultado salvo em `creative_references` com `source_url`,
             metadados extraídos, `format_classification` e
             `structure_analysis`.

          8. Componente reutilizável `<LinkAnalyzer />`: input de URL com
             paste detection, loading state durante análise, card de
             resultado com preview + metadados + formato classificado.
             Usado no quiz (Caminhos 1A e 1B) e como feature standalone
             em `/references`.

          9. Erro de URL inválida ou plataforma não suportada: mensagem
             clara ao aluno. Erro de API: fallback "Não foi possível
             analisar este link. Tente fazer upload manual."

          ### Story 9.4 — Busca de Conteúdos Orgânicos Virais

          As a student doing the Organic Video path (1B),
          I want to search viral organic content in my niche,
          so that I can model my video after proven viral references.

          **Acceptance Criteria:**

          1. `GET /api/references/organic?q={query}&platforms=tiktok,youtube,instagram&limit=20`
             busca conteúdos orgânicos virais em múltiplas plataformas.

          2. **YouTube Data API v3:**
             - Busca por keyword com filtro `type=video`,
               `videoDuration=short` (< 4min), `order=viewCount`,
               `regionCode=BR`, `relevanceLanguage=pt`
             - Retorna: title, views, likes, comments, duration,
               thumbnail URL, publishedAt, channelTitle
             - Quota: 100 units por search (100 buscas/dia com 10k units)

          3. **TikTok Research API:**
             - Busca por keyword/hashtag com filtro de região e período
             - Retorna: views, likes, shares, comments, duration,
               music info, create_time
             - Se API não aprovada ainda: feature desabilitada para
               TikTok com mensagem "Em breve" (sem erro)

          4. **Instagram Graph API:**
             - Busca por hashtag (requer Instagram Business Account
               conectada via Meta Developer App)
             - Retorna: top posts da hashtag com likes, comments,
               permalink, media_url, timestamp
             - Limitação: 30 resultados por hashtag, últimos 7 dias
               para top_media

          5. Resultados consolidados de todas as plataformas em lista
             unificada, ordenados por engajamento (views para vídeo,
             likes+comments para imagens). Badge de plataforma em cada
             resultado (ícone TikTok/YouTube/Instagram).

          6. Cache por busca: 12h para orgânico (conteúdo muda mais
             rápido que ads). Implementado via tabela `search_cache`.

          7. Integração no quiz: no Caminho 1B, após pergunta Q4 (nicho),
             seção "Conteúdos Virais" aparece com resultados. Aluno pode
             selecionar referência viral para modelar.

          8. Quando aluno seleciona referência, `creative_references`
             registrada. Se for vídeo, aluno pode optar por upload
             para análise profunda via Epic 7 ou seguir com metadados
             + thumbnail apenas.

          9. Filtros no frontend: plataforma (TikTok/YouTube/Instagram/
             todos), período (7d/30d), tipo (vídeo/imagem). Filtros
             aplicados client-side sobre resultados já buscados.

          10. Cada plataforma que falhar não impede as outras de
              retornar resultados. Fallback por plataforma independente.

          ### Story 9.5 — Classificação Automática de Formato

          As a developer,
          I want the AI to automatically classify the format of any
          creative reference,
          so that the format feeds into the script generation prompt.

          **Acceptance Criteria:**

          1. Função `classifyFormat(mediaUrl | imageBuffer, adCopy?)`
             envia mídia para Claude Vision (`claude-haiku-4-5-20251001`)
             com prompt de classificação.

          2. Formatos reconhecidos (enum `CreativeFormat`):
             `TOP_5`, `BEFORE_AFTER`, `THIS_OR_THAT`, `TESTIMONIAL`,
             `TUTORIAL`, `INFORMATIVE`, `LOW_FI`, `PROVOCATION`,
             `QUESTION`, `RANKING`, `CURIOSITY`, `TRANSFORMATION`,
             `BEHIND_SCENES`, `UNBOXING`, `POV`, `STORYTELLING`,
             `CHALLENGE`, `OTHER`

          3. Retorno tipado: `{ format: CreativeFormat, confidence:
             'HIGH' | 'MEDIUM' | 'LOW', reasoning: string }`

          4. Se confiança `LOW`: UI mostra classificação com badge
             amarelo "Verificar" + dropdown para aluno corrigir.
             Se `HIGH`: mostra como definitivo com opção de editar.

          5. Formato classificado (ou corrigido) salvo em
             `creative_references.format_classification` (ou
             `format_corrected` se aluno alterou)

          6. Formato alimenta diretamente a seleção de módulos
             contextuais no prompt de geração (camada 2 do Prompt
             Architecture) — Ex: formato `TOP_5` ativa módulo
             "estrutura de lista com contagem regressiva"

          7. Custo em créditos: classificação via Haiku é barata
             (~0.5-1 crédito por classificação). Deduzido do saldo.
             Gate pré-chamada funciona normalmente.

          8. Batch classification: quando busca retorna 20 resultados,
             sistema classifica apenas os 5 primeiros automaticamente
             (economia de créditos). Demais classificados sob demanda
             quando aluno clica.

          9. Classification cache: se mesma `source_url` já foi
             classificada, reutiliza resultado sem nova chamada IA.

          ### Story 9.6 — Integração com Quiz: Reference Picker

          As a student,
          I want to pick a reference from search results directly in
          the quiz flow,
          so that the AI uses my chosen reference to generate the script.

          **Acceptance Criteria:**

          1. Componente `<ReferencePicker />` integrado ao quiz entre
             a seção Quiz Inicial e os Caminhos 2A/2B.

          2. Se Caminho 1A (Anúncio): exibe busca de ads (Story 9.2)
             com campo de busca pré-preenchido com nicho do onboarding.
             Se Caminho 1B (Orgânico): exibe busca de virais (Story 9.4)
             com campo pré-preenchido.

          3. Aluno pode: (a) selecionar referência da busca,
             (b) colar link de post social (Story 9.3),
             (c) fazer upload manual de vídeo (Caminho 2A existente),
             (d) pular e criar do zero (Caminho 2B).

          4. Ao selecionar referência da busca ou via link:
             - `creative_references` criada e vinculada ao quiz session
             - Formato classificado automaticamente (Story 9.5)
             - Se vídeo e aluno quer análise profunda → redirect para
               upload manual (pipeline Epic 7)
             - Se imagem ou thumbnail suficiente → análise de estrutura
               via Vision e segue no quiz

          5. A referência selecionada e sua análise alimentam o prompt
             de geração do roteiro (Story 6.5): formato classificado,
             ad copy, estrutura analisada, metadados de engajamento.
             Adicionados como bloco de contexto no prompt.

          6. Quiz session registra `reference_source` (enum: API_SEARCH
             | LINK_ANALYSIS | MANUAL_UPLOAD | NONE) para analytics.

          7. UX: tela dividida — busca/resultados à esquerda, preview
             da referência selecionada à direita. Mobile: tabs entre
             busca e preview.

          8. Loading states para: busca em andamento, classificação
             de formato, análise de link. Empty state quando busca
             não retorna resultados: "Nenhuma referência encontrada.
             Tente outro termo ou faça upload manual."

          ### Story 9.7 — Admin: API Configurations & Enrichment

          As a SOL administrator,
          I want to configure API integrations and enrichment layers
          from the admin panel,
          so that I can manage external services without code changes.

          **Acceptance Criteria:**

          1. Página `/admin/integrations` (protegida por `role: ADMIN`)
             lista todas as APIs configuradas com status (ativa/inativa),
             rate limit atual vs usado, e última verificação de saúde.

          2. Admin pode ativar/desativar cada API individualmente.
             API desativada: feature correspondente oculta no quiz.
             Nunca erro — simplesmente não aparece.

          3. Admin pode configurar enrichment layer: URL da API,
             nome da env var da chave, status ativo/inativo.
             Enrichment desativado: busca usa apenas APIs oficiais.

          4. Health check: botão "Testar Conexão" para cada API.
             Faz chamada de teste e reporta: OK (latência), erro
             (mensagem), rate limit (restante).

          5. Métricas de uso por API: total de chamadas hoje/7d/30d,
             cache hits vs misses, erros por período. Dados da
             tabela `search_cache` e logs.

          6. Novas env vars documentadas no `.env.example`:
             `META_AD_LIBRARY_ACCESS_TOKEN`, `YOUTUBE_API_KEY`,
             `TIKTOK_RESEARCH_CLIENT_KEY`, `TIKTOK_RESEARCH_CLIENT_SECRET`,
             `INSTAGRAM_ACCESS_TOKEN`, `ENRICHMENT_API_KEY` (opcional),
             `ENRICHMENT_API_URL` (opcional)

          7. Todas as rotas `/api/admin/integrations/*` verificam
             `role: ADMIN` server-side.

          ### Story 9.8 — Análise de Perfis de Concorrentes

          As a student,
          I want to analyze a competitor's social media profile,
          so that I can see what content works for them and model mine.

          **Acceptance Criteria:**

          1. Página `/references/competitors` (protegida por auth)
             permite aluno adicionar perfis de concorrentes por @ ou URL.

          2. `POST /api/references/competitors` recebe handle/URL,
             detecta plataforma, busca últimos 20 posts via API oficial.

          3. Posts ordenados por engajamento. Exibe: thumbnail, caption
             resumida, métricas (views/likes/comments), data, formato
             classificado (batch — top 5 posts classificados auto).

          4. Aluno pode "Usar como Referência" em qualquer post →
             cria `creative_references` e pode ser selecionado no
             próximo quiz.

          5. Dados salvos em `competitor_profiles` com `top_posts`
             (JSON dos posts mais relevantes). Refresh manual via
             botão "Atualizar" (respeitando rate limits).

          6. Limite: 5 perfis de concorrentes por aluno (MVP).
             CRUD completo: adicionar, remover perfis.

          7. Feature complementar — fora do quiz principal. Acessível
             via sidebar "Concorrentes" no menu de navegação.

          ### Story 9.9 — Enrichment Layer: Terceiros (Opcional)

          As a developer,
          I want an optional enrichment layer that adds historical data
          from third-party APIs,
          so that search results are richer when the service is available.

          **Acceptance Criteria:**

          1. Service `EnrichmentService` em
             `apps/web/lib/services/enrichment.ts` com interface genérica:
             `search(query, type: 'ads'|'organic'): EnrichmentResult[]`

          2. Adapter pattern: `AdSpyAdapter`, `BigSpyAdapter`,
             `ApifyAdapter` implementam mesma interface. Admin configura
             qual adapter usar via `api_configurations`.

          3. Enrichment é chamado em paralelo com APIs oficiais.
             Timeout: 5 segundos. Se não responder a tempo, resultado
             descartado silenciosamente.

          4. Resultados do enrichment exibidos em seção separada
             "Referências Históricas" com badge "Histórico".
             Nunca misturados com resultados oficiais sem distinção.

          5. Deduplicação: se mesmo criativo aparece na API oficial
             e no enrichment, mantém apenas o da API oficial
             (dados mais confiáveis).

          6. Se enrichment indisponível (API fora, desativado pelo
             admin, timeout): nenhum erro visível. Seção "Referências
             Históricas" simplesmente não aparece. Aluno não sabe
             que existia algo a mais.

          7. Custo do enrichment ($99-149/mês) é custo operacional
             fixo do SOL — não repassado ao aluno via créditos.
             Chamadas ao enrichment não consomem créditos do aluno.

          8. Logs de uso do enrichment para admin: chamadas, hits,
             erros, latência. Disponível em `/admin/integrations`.

        artifacts:
          - "docs/prd.md"
        verification:
          type: manual
          instructions: |
            Verificar que:
            - FR35-FR41 adicionados à seção Functional Requirements
            - Epic 9 adicionado com 9 stories (9.1-9.9)
            - Cada story tem ACs numerados e testáveis
            - Changelog atualizado
            - Nenhum outro Epic/Story/FR alterado
            - Integração com quiz (Epic 6) documentada nos ACs
            - Fallback gracioso documentado em toda interação com API
            - Novas env vars listadas no Technical Assumptions

  # ===========================================================================
  # PHASE 2 — ARCHITECTURE
  # ===========================================================================
  - id: phase-2-architecture
    name: "Arquitetura — Epic 9"
    description: "Atualizar architecture.md com novas integrações, padrões e schema"
    agent: "@architect"
    dependsOn: ["phase-1-prd"]

    steps:
      - id: "2.1"
        action: "update-architecture"
        description: "Definir arquitetura de integrações externas com fallback"
        prompt: |
          @architect — PRD atualizado com Epic 9 (Ad Intelligence).
          Atualizar `docs/architecture.md` para v4.0:

          1. **Novas dependências no Tech Stack:**

             | Technology | Version | Purpose | Rationale |
             |---|---|---|---|
             | Meta Ad Library API | v17+ | Busca de ads ativos | Oficial, gratuita, legal, zero lock-in |
             | YouTube Data API v3 | v3 | Busca de vídeos orgânicos | Oficial Google, quota generosa, estável |
             | TikTok Research API | v2 | Busca de vídeos virais | Oficial TikTok, requer aprovação |
             | Instagram Graph API | v18+ | Busca por hashtag | Oficial Meta, via mesmo app |

          2. **Architectural Pattern: API Gateway com Fallback Gracioso**

             Novo padrão documentado:
             ```
             Client → API Route → APIGateway
                                    ├→ OfficialAPI (primário, sempre)
                                    ├→ EnrichmentAPI (opcional, timeout 5s)
                                    └→ Cache (fallback se ambos falharem)
             ```

             - Toda chamada a API externa passa pelo APIGateway
             - Gateway gerencia: rate limiting, cache, retry, fallback
             - Se API oficial falha: retorna cache stale se existir
             - Se enrichment falha: ignora silenciosamente
             - Se tudo falha: mensagem amigável + opção upload manual
             - Nunca propaga erro técnico ao frontend

          3. **Service Layer:**
             ```
             apps/web/lib/services/
             ├── api-gateway.ts          # Gateway genérico com cache + retry
             ├── ad-library.ts           # Meta Ad Library API
             ├── youtube-search.ts       # YouTube Data API v3
             ├── tiktok-research.ts      # TikTok Research API
             ├── instagram-search.ts     # Instagram Graph API
             ├── link-analyzer.ts        # Detecção de plataforma + extração
             ├── format-classifier.ts    # Classificação via Claude Vision
             ├── enrichment.ts           # Adapter para terceiros
             └── competitor-analyzer.ts  # Análise de perfis
             ```

          4. **Cache Strategy:**
             - Tabela `search_cache` no PostgreSQL (não Redis — zero lock-in)
             - TTL: 24h para ads, 12h para orgânico
             - Cache key: hash(query + source + country + filters)
             - Stale cache servido se API falhar (melhor stale que erro)
             - Cleanup job: cron via GitHub Actions ou script npm,
               deleta cache expirado diariamente

          5. **Índices para novas tabelas:**
             - `creative_references`: `(source, search_query)`,
               `(user_id, created_at)`, `(quiz_session_id)`
             - `search_cache`: `(query_hash)`, `(expires_at)`
             - `competitor_profiles`: `(user_id, platform)`

          6. **Rate Limiting Strategy:**
             - Implementar rate limiter por API em memória (Map)
             - Tracking: calls/hora por API
             - Se atingir 80% do limite: throttle (delay entre calls)
             - Se atingir 100%: retorna cache + aviso

          7. **Diagrama atualizado** incluindo novas integrações:
             ```
             External APIs:
               Meta Ad Library API ──┐
               YouTube Data API ────┼── APIGateway → Cache → DB
               TikTok Research API ──┤
               Instagram Graph API ──┤
               Enrichment (opcional) ┘
             ```

          8. **Segurança:**
             - Chaves de API NUNCA no banco — apenas nome da env var
               salvo em `api_configurations.api_key_env`
             - Valores reais em `.env`
             - Frontend nunca recebe chaves ou tokens de API

          Validar zero lock-in: todas APIs oficiais são substituíveis.
          Enrichment é explicitamente opcional.

        artifacts:
          - "docs/architecture.md"
        verification:
          type: manual
          instructions: |
            Verificar que:
            - Tech stack atualizado com 4 novas APIs
            - API Gateway pattern documentado com diagrama
            - Service layer structure definido
            - Cache strategy documentada (PostgreSQL, não Redis)
            - Rate limiting strategy documentada
            - Índices para novas tabelas definidos
            - Segurança de chaves documentada
            - Zero lock-in validado

