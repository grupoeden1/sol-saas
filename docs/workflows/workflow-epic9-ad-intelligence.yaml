        action: "implement-meta-ad-library"
        description: "Story 9.2 — Meta Ad Library API service + route"
        prompt: |
          @dev — Implementar Story 9.2 (Meta Ad Library API Integration).

          1. Criar `apps/web/lib/services/ad-library.ts`:
             - Usa API Gateway (gateway.ts) para chamadas
             - Endpoint: `https://graph.facebook.com/v18.0/ads_archive`
             - Params: `search_terms`, `ad_reached_countries=BR`,
               `ad_active_status=ACTIVE`, `fields=ad_creative_bodies,
               ad_delivery_start_time,page_name,publisher_platforms,
               ad_snapshot_url`
             - Auth: `access_token` via env var `META_AD_LIBRARY_ACCESS_TOKEN`
             - Parse response: extrair ad_copy, preview_url, start_date,
               calcular days_active
             - Ordenar por days_active DESC

          2. Criar `apps/web/app/api/references/ads/route.ts`:
             - `GET /api/references/ads?q={query}&country=BR&limit=20`
             - Validação Zod: q (string min 2), country (default BR),
               limit (int 1-50, default 20)
             - Auth required (session check)
             - Chama AdLibraryService via gateway
             - Retorna resultados formatados

          3. Cache: 24h via search_cache. Gateway gerencia.

          4. Error handling:
             - API timeout → retorna cache stale ou empty com mensagem
             - Rate limit → retorna cache + header X-Rate-Limited
             - Auth error → log + retorna erro genérico
             - Nunca expor detalhes técnicos ao frontend

          TypeScript strict. Sem any. Sem localStorage.

        files:
          - "apps/web/lib/services/ad-library.ts"
          - "apps/web/app/api/references/ads/route.ts"
        verification:
          type: command
          command: "npm run typecheck"

      - id: "5.2"
        action: "implement-link-analyzer"
        description: "Story 9.3 — Link Analysis service + route"
        prompt: |
          @dev — Implementar Story 9.3 (Link Analysis).

          1. Criar `apps/web/lib/services/link-analyzer.ts`:
             - `detectPlatform(url: string)`: regex para detectar
               TikTok, Instagram, YouTube, Facebook
             - `analyzeLink(url: string)`: detecta plataforma, extrai
               metadados via oEmbed ou API oficial, retorna dados
               normalizados

          2. oEmbed endpoints (públicos, sem auth):
             - YouTube: `https://www.youtube.com/oembed?url={url}&format=json`
             - Instagram: `https://api.instagram.com/oembed?url={url}`
             - TikTok: `https://www.tiktok.com/oembed?url={url}`
             - Facebook: `https://www.facebook.com/plugins/post/oembed.json?url={url}`

          3. Para YouTube, enriquecer com Data API v3 se disponível:
             extrair videoId da URL → `GET /youtube/v3/videos?id={id}&part=statistics,snippet,contentDetails`
             → views, likes, duration, publishedAt

          4. Criar `apps/web/app/api/references/analyze-link/route.ts`:
             - `POST /api/references/analyze-link` body: `{ url: string }`
             - Validação Zod: url (string url format)
             - Auth required
             - Retorna metadados + classificação de formato (se imagem disponível)

          5. Se mídia é imagem: chama FormatClassifier automaticamente
          6. Se mídia é vídeo: retorna metadados + thumbnail, aluno
             decide se quer análise profunda (upload)

          7. Salva em `creative_references` com source='LINK_ANALYSIS'

          8. Criar componente `apps/web/components/references/link-analyzer.tsx`:
             - Client Component
             - Input de URL com paste detection (onPaste → auto submit)
             - Loading state durante análise
             - Card de resultado: preview + metadados + formato

          TypeScript strict. Sem any.

        files:
          - "apps/web/lib/services/link-analyzer.ts"
          - "apps/web/app/api/references/analyze-link/route.ts"
          - "apps/web/components/references/link-analyzer.tsx"
        verification:
          type: command
          command: "npm run typecheck"

      - id: "5.3"
        action: "implement-organic-search"
        description: "Story 9.4 — YouTube, TikTok, Instagram search services"
        prompt: |
          @dev — Implementar Story 9.4 (Busca de Conteúdos Orgânicos Virais).

          1. Criar `apps/web/lib/services/youtube-search.ts`:
             - Usa API Gateway
             - Endpoint: `https://www.googleapis.com/youtube/v3/search`
             - Params: `q={query}`, `type=video`, `videoDuration=short`,
               `order=viewCount`, `regionCode=BR`, `relevanceLanguage=pt`,
               `maxResults={limit}`, `key={YOUTUBE_API_KEY}`
             - Enriquecer com `/videos?part=statistics` para views/likes
             - Retorna formato normalizado

          2. Criar `apps/web/lib/services/tiktok-research.ts`:
             - Usa API Gateway
             - Endpoint: TikTok Research API v2
             - Feature flag: verifica `api_configurations` se TikTok enabled
             - Se disabled: retorna `{ data: [], unavailable: true }`
               (sem erro)
             - Se enabled: busca por keyword com filtros

          3. Criar `apps/web/lib/services/instagram-search.ts`:
             - Usa API Gateway
             - Instagram Graph API: hashtag search
             - Requer: Instagram Business Account token
             - Busca top_media da hashtag → retorna posts com métricas
             - Limitação: 30 resultados, últimos 7 dias

          4. Criar `apps/web/app/api/references/organic/route.ts`:
             - `GET /api/references/organic?q={query}&platforms=youtube,
               tiktok,instagram&limit=20`
             - Chama services habilitados em PARALELO (Promise.allSettled)
             - Cada plataforma que falhar não impede as outras
             - Consolida resultados, ordena por engajamento
             - Badge de plataforma em cada resultado

          5. Cache: 12h via search_cache.

          6. Formato normalizado de resultado:
             ```typescript
             interface OrganicResult {
               platform: 'youtube' | 'tiktok' | 'instagram'
               title: string
               url: string
               thumbnailUrl: string
               metrics: {
                 views?: number
                 likes?: number
                 comments?: number
                 shares?: number
               }
               duration?: number // seconds
               publishedAt: string
               authorName: string
             }
             ```

          TypeScript strict. Sem any.

        files:
          - "apps/web/lib/services/youtube-search.ts"
          - "apps/web/lib/services/tiktok-research.ts"
          - "apps/web/lib/services/instagram-search.ts"
          - "apps/web/app/api/references/organic/route.ts"
        verification:
          type: command
          command: "npm run typecheck"

