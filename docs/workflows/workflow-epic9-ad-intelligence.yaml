               days_active, plataforma, anunciante

          3. Se path1 = ORGANIC:
             - Mostra busca de virais (chama /api/references/organic)
             - Campo pré-preenchido com tema
             - Grid: thumbnail, título, métricas, plataforma, autor
             - Filtros: plataforma, período

          4. Em ambos os caminhos:
             - Tab "Colar Link" → componente LinkAnalyzer (Story 9.3)
             - Tab "Upload Manual" → redirect para upload (Epic 7)
             - Tab "Criar do Zero" → pula referência, segue quiz

          5. Ao selecionar referência:
             - POST /api/references/select: cria creative_references
               vinculada ao quiz_session_id
             - Classifica formato automaticamente (Story 9.5)
             - Mostra card expandido com: preview grande, metadados
               completos, formato classificado

          6. Integrar no quiz engine (Story 6.3):
             - ReferencePicker aparece como seção entre Quiz Inicial
               e Caminhos 2A/2B
             - Sidebar atualizada com nova seção "Referências"
             - Barra de progresso inclui nova seção

          7. `quiz_sessions` recebe novo campo `reference_source`:
             enum API_SEARCH | LINK_ANALYSIS | MANUAL_UPLOAD | NONE

          8. Atualizar Story 6.5 (Geração de Roteiro):
             - Prompt de geração inclui bloco de contexto da referência:
               formato classificado, ad copy, estrutura analisada,
               métricas de engajamento
             - Se referência é de ad: adicionar ao módulo "Anúncio"
             - Se referência é orgânica: adicionar ao módulo "Orgânico"

          9. UX responsivo:
             - Desktop: split view (busca esquerda, preview direita)
             - Mobile: tabs (busca / preview)
             - Loading states em todas as interações
             - Empty state: "Nenhuma referência encontrada.
               Tente outro termo, cole um link, ou faça upload."

          TypeScript strict. Tailwind + Shadcn/UI. Dark/solar theme.

        files:
          - "apps/web/components/quiz/reference-picker.tsx"
          - "apps/web/components/references/reference-card.tsx"
          - "apps/web/components/references/reference-grid.tsx"
          - "apps/web/app/api/references/select/route.ts"
        verification:
          type: browser
          url: "http://localhost:3000/novo-roteiro"
          actions:
            - "Verificar ReferencePicker aparece no quiz"
            - "Verificar busca de ads retorna resultados (com seed/mock)"
            - "Verificar busca de orgânicos retorna resultados"
            - "Verificar colar link funciona"
            - "Verificar seleção de referência persiste no quiz session"
            - "Verificar formato classificado exibido"

  # ===========================================================================
  # PHASE 7 — IMPLEMENTATION: Admin + Competitors + Enrichment
  # ===========================================================================
  - id: phase-7-admin-and-extras
    name: "Implementação — Admin, Concorrentes e Enrichment"
    description: "Features complementares: admin de integrações, análise de concorrentes, enrichment"
    agent: "@dev"
    dependsOn: ["phase-6-quiz-integration"]

    steps:
      - id: "7.1"
        action: "implement-admin-integrations"
        description: "Story 9.7 — Admin panel para configuração de APIs"
        prompt: |
          @dev — Implementar Story 9.7 (Admin: API Configurations).

          1. Criar página `/admin/integrations`:
             - Protegida por role: ADMIN
             - Lista APIs da tabela api_configurations
             - Para cada API: nome, status (ativo/inativo toggle),
               rate limit (usado/total), última verificação

          2. API Routes:
             - GET /api/admin/integrations — lista todas as configs
             - PUT /api/admin/integrations/[provider] — atualizar config
             - POST /api/admin/integrations/[provider]/health — health check

          3. Health check: testa conexão com chamada mínima à API
             Retorna: { status: 'ok'|'error', latencyMs, message }

          4. Métricas por API: queries na search_cache
             - Total de chamadas (count por source)
             - Cache hits vs misses
             - Erros (logs)

          5. Seção "Enrichment" separada:
             - Input URL da API + env var name
             - Toggle ativo/inativo
             - Health check

          6. Visual consistente com /admin existente (dark/solar)

          Todas as rotas verificam role: ADMIN server-side.

        files:
          - "apps/web/app/(dashboard)/admin/integrations/page.tsx"
          - "apps/web/app/api/admin/integrations/route.ts"
          - "apps/web/app/api/admin/integrations/[provider]/route.ts"
          - "apps/web/app/api/admin/integrations/[provider]/health/route.ts"
        verification:
          type: browser
          url: "http://localhost:3000/admin/integrations"

      - id: "7.2"
        action: "implement-competitors"
        description: "Story 9.8 — Análise de perfis de concorrentes"
        prompt: |
          @dev — Implementar Story 9.8 (Análise de Perfis de Concorrentes).

          1. Criar `apps/web/lib/services/competitor-analyzer.ts`:
             - `analyzeProfile(handle, platform)`: busca últimos 20 posts
               via API oficial da plataforma
             - Ordena por engajamento
             - Classifica formato dos top 5 posts (batch, Story 9.5)

          2. Criar página `/references/competitors`:
             - Protegida por auth
             - Lista perfis salvos do aluno
             - Botão "Adicionar Concorrente": input handle/URL + plataforma
             - Card por perfil: nome, plataforma, último fetch, top posts

          3. API Routes:
             - GET /api/references/competitors — lista perfis do aluno
             - POST /api/references/competitors — adicionar perfil
             - DELETE /api/references/competitors/[id] — remover
             - POST /api/references/competitors/[id]/refresh — atualizar

          4. Limite: 5 perfis por aluno. Validado server-side.

          5. "Usar como Referência" em qualquer post:
             - Cria creative_references
             - Pode ser selecionado no próximo quiz

          6. Sidebar do SOL: adicionar link "Concorrentes" na navegação

        files:
          - "apps/web/lib/services/competitor-analyzer.ts"
          - "apps/web/app/(dashboard)/references/competitors/page.tsx"
          - "apps/web/app/api/references/competitors/route.ts"
        verification:
          type: browser
          url: "http://localhost:3000/references/competitors"

      - id: "7.3"
        action: "implement-enrichment"
        description: "Story 9.9 — Enrichment layer com fallback silencioso"
        prompt: |
          @dev — Implementar Story 9.9 (Enrichment Layer).

          1. Criar `apps/web/lib/services/enrichment.ts`:
             - Interface `EnrichmentAdapter`:
               `search(query, type): EnrichmentResult[]`
             - Implementação genérica que chama URL configurada em
               api_configurations (provider='enrichment')

          2. Integrar no fluxo de busca:
             - AdLibraryService e OrganicSearchService chamam
               enrichment em PARALELO com API oficial
             - `Promise.race` com timeout de 5 segundos
             - Se enrichment não responder a tempo: descartado

          3. Deduplicação: comparar source_url dos resultados
             - Se duplicata: manter resultado da API oficial
             - Se único do enrichment: adicionar com badge "Histórico"

          4. Se enrichment desativado no admin OU indisponível:
             - Nenhuma chamada feita
             - Nenhuma seção "Histórico" exibida
             - Nenhum erro, nenhum log de warning para o aluno
             - Silenciosamente ausente

          5. Sem custo de créditos para o aluno.
             Custo operacional fixo do SOL.

          TypeScript strict. Adapter pattern. Sem any.

        files:
          - "apps/web/lib/services/enrichment.ts"
        verification:
          type: command
          command: "npm run typecheck"

  # ===========================================================================
  # PHASE 8 — QUALITY ASSURANCE
  # ===========================================================================
  - id: phase-8-qa
    name: "Quality Assurance — Epic 9"
    description: "Validação completa: fallbacks, rate limits, segurança, integração com quiz"
    agent: "@qa"
    dependsOn: ["phase-7-admin-and-extras"]

    steps:
      - id: "8.1"
        action: "review-epic-9"
        description: "Review completo do Epic 9"
        prompt: |
          @qa — Review completo do Epic 9 (Ad Intelligence).
          Este epic é CRÍTICO porque integra 4+ APIs externas que podem
          falhar a qualquer momento. Foco em resiliência.

          1. **Fallback Testing (PRIORIDADE MÁXIMA):**
             Para CADA API (Meta, YouTube, TikTok, Instagram, Enrichment):
             - Simular API fora (timeout): verificar que fallback funciona
             - Simular rate limit atingido: verificar cache stale ou mensagem
             - Simular resposta malformada: verificar error handling
             - Simular todas as APIs fora simultaneamente: verificar que
               quiz funciona com upload manual apenas
             - Em NENHUM cenário o aluno deve ver erro técnico

          2. **Cache Validation:**
             - Verificar TTL: ads cache expira em 24h, orgânico em 12h
             - Verificar cache stale: se API falha, cache expirado
               é servido (melhor stale que erro)
             - Verificar deduplicação: mesma query não gera cache duplicado
             - Verificar cleanup: cache expirado é deletado

          3. **Rate Limiting:**
             - Verificar que rate limiter previne excesso de chamadas
             - Verificar que throttling funciona a 80% do limite
             - Verificar que burst de alunos buscando mesmo nicho
               é absorvido pelo cache

          4. **Classificação de Formato:**
             - Verificar que classificação retorna formato válido do enum
             - Verificar que confiança LOW mostra badge de verificação
             - Verificar que correção manual do aluno é persistida
             - Verificar que cache de classificação funciona

          5. **Integração com Quiz:**
             - Fluxo completo: quiz → busca → seleção → classificação
               → geração de roteiro com contexto da referência
             - Verificar que referência selecionada aparece no prompt
             - Verificar que quiz funciona sem referência (skip)
             - Verificar que quiz funciona com upload manual (2A)

          6. **Segurança:**
             - Chaves de API nunca expostas no frontend (network tab)
             - /api/admin/integrations/* retorna 403 sem role ADMIN
             - /api/references/* requer autenticação
             - URLs maliciosas no link analyzer não causam SSRF

          7. **Performance:**
             - Busca de ads retorna em < 3s (incluindo API call ou cache)
             - Busca de orgânicos (3 APIs paralelo) retorna em < 5s
             - Classificação de formato retorna em < 2s
             - Página /admin/integrations carrega em < 2s

          8. **Regressão:**
             - Quiz existente (Epic 6) funciona sem Epic 9 ativo
               (se todas APIs desativadas)
             - Chat (Epic 2) não afetado
             - Créditos (Epic 3) não afetados
             - Upload de vídeo (Epic 7) funciona independentemente

          Gerar relatório de QA em docs/qa/epic9-qa-report.md

        artifacts:
          - "docs/qa/epic9-qa-report.md"
        verification:
          type: manual
          instructions: |
            Verificar que:
            - Relatório gerado com PASS/FAIL por item
            - Todos os cenários de fallback testados
            - Nenhum FAIL crítico (erro visível ao aluno)
            - Issues documentados como backlog

  # ===========================================================================
  # PHASE 9 — FIXES & VALIDATION
  # ===========================================================================
  - id: phase-9-fixes
    name: "Correções e Validação Final"
    description: "Aplicar fixes do QA e validar DoD do Epic 9"
    agent: "@dev"
    dependsOn: ["phase-8-qa"]

    steps:
      - id: "9.1"
        action: "fix-qa-issues"
        description: "Aplicar correções do relatório de QA"
        prompt: |
          @dev — Aplicar correções do relatório de QA do Epic 9
          (docs/qa/epic9-qa-report.md).

          PRIORIDADE:
          1. Qualquer cenário onde erro técnico é visível ao aluno
          2. Fallbacks que não funcionam
          3. Problemas de segurança (chaves expostas, SSRF)
          4. Rate limiting não funcionando
          5. Issues visuais ou de UX

          Para cada fix: referenciar item do QA, explicar causa raiz,
          implementar correção, verificar sem regressão.

        verification:
          type: command
          command: "npm run typecheck && npm run lint && npm run build"

      - id: "9.2"
        action: "validate-dod"
        description: "Validação final do Definition of Done do Epic 9"
        prompt: |
          @dev — Validação final do DoD do Epic 9.

          Checklist:
          - [ ] Schema: 4 tabelas criadas, relações funcionando
          - [ ] Meta Ad Library: busca funcional, cache 24h, fallback
          - [ ] Link Analysis: detecta 4 plataformas, classifica formato
          - [ ] YouTube: busca funcional, resultados com métricas
          - [ ] TikTok: feature flag funcional (disabled = sem erro)
          - [ ] Instagram: busca por hashtag funcional
          - [ ] Format Classifier: 18 formatos, confiança, correção manual
          - [ ] Reference Picker: integrado no quiz, 4 opções (busca/link/upload/skip)
          - [ ] Admin Integrations: CRUD, health check, métricas
          - [ ] Competitors: CRUD, limite 5, "usar como referência"
          - [ ] Enrichment: adapter pattern, timeout 5s, fallback silencioso
          - [ ] Fallback: TODAS as APIs fora = quiz funciona via upload
          - [ ] Segurança: chaves não expostas, SSRF prevenido, auth ok
          - [ ] Regressão: quiz, chat, créditos, video — tudo funciona
          - [ ] TypeScript strict sem erros
          - [ ] Build passa

        verification:
          type: manual
          instructions: "Todos os itens do checklist marcados"

