# Docker Compose - Dev Infrastructure (PostgreSQL + Redis)
# Kestra has its own docker-compose in apps/kestra/

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sol
      POSTGRES_PASSWORD: sol_password
      POSTGRES_DB: sol_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sol -d sol_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sol-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
