version: "3.8"

services:
  postgres:
    image: postgres:17-alpine
    container_name: sol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sol_user
      POSTGRES_PASSWORD: sol_password_dev
      POSTGRES_DB: sol_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sol_user -d sol_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
